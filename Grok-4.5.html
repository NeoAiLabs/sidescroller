<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grok-4.5 — Hermes Agent Side-Scroller</title>
<style>
  /* ========== Retro-tech global styles ========== */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050510;
    font-family: "Courier New", Courier, monospace;
    color: #e0f7ff;
    user-select: none;
  }

  #wrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 20% 30%, #1a0a3a 0%, transparent 50%),
      radial-gradient(ellipse at 80% 70%, #0a2a3a 0%, transparent 50%),
      linear-gradient(180deg, #050510 0%, #0a0a20 100%);
  }

  canvas {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 3px solid #00ffc8;
    box-shadow:
      0 0 20px rgba(0, 255, 200, 0.35),
      0 0 60px rgba(120, 0, 255, 0.25),
      inset 0 0 30px rgba(0, 255, 200, 0.05);
    background: #000;
    cursor: crosshair;
  }

  /* Subtle CRT scanline overlay via body::after is handled on canvas */
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
</div>

<script>
/**
 * =============================================================================
 *  GROK-4.5 — Hermes Agent Side-Scroller
 *  Single-file HTML5 canvas game. No external assets.
 *  A tiny hooded terminal explorer races a chaotic digital shoreline
 *  to defeat the disfigured cyber-lobster boss.
 * =============================================================================
 */

(() => {
  "use strict";

  // ---------------------------------------------------------------------------
  // Canvas & core setup
  // ---------------------------------------------------------------------------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;   // 960
  const H = canvas.height;  // 540

  // Scale canvas to fit viewport while keeping aspect ratio
  function resizeCanvas() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.96;
    canvas.style.width = Math.floor(W * scale) + "px";
    canvas.style.height = Math.floor(H * scale) + "px";
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  // ---------------------------------------------------------------------------
  // Game constants
  // ---------------------------------------------------------------------------
  const GRAVITY = 0.55;
  const JUMP_V = -11.5;
  const MOVE_SPEED = 4.2;
  const FRICTION = 0.82;
  const MAX_FALL = 14;
  const BOLT_SPEED = 11;
  const BOLT_COOLDOWN = 220; // ms
  const WORLD_END = 9200;    // level length in px
  const BOSS_X = 8600;       // boss arena start
  const GROUND_Y = 460;

  // Game states
  const STATE = {
    START: "start",
    PLAY: "play",
    WIN: "win",
    OVER: "over"
  };

  // ---------------------------------------------------------------------------
  // Input
  // ---------------------------------------------------------------------------
  const keys = Object.create(null);
  let mouseDown = false;

  window.addEventListener("keydown", (e) => {
    keys[e.code] = true;
    // Prevent page scroll on game keys
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) {
      e.preventDefault();
    }
    // Start game from title
    if (game.state === STATE.START && (e.code === "Enter" || e.code === "Space")) {
      startGame();
    }
    // Restart
    if ((game.state === STATE.OVER || game.state === STATE.WIN) && e.code === "KeyR") {
      startGame();
    }
  });

  window.addEventListener("keyup", (e) => {
    keys[e.code] = false;
  });

  canvas.addEventListener("mousedown", (e) => {
    if (e.button === 0) {
      mouseDown = true;
      if (game.state === STATE.START) startGame();
      if (game.state === STATE.PLAY) tryShoot();
    }
  });
  canvas.addEventListener("mouseup", () => { mouseDown = false; });
  canvas.addEventListener("mouseleave", () => { mouseDown = false; });

  // ---------------------------------------------------------------------------
  // Utility helpers
  // ---------------------------------------------------------------------------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const irand = (a, b) => Math.floor(rand(a, b + 1));
  const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);

  function rectOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // Simple seeded noise-ish wave for parallax / glitch
  function wave(t, seed) {
    return Math.sin(t * 0.7 + seed) * 0.5 + Math.sin(t * 1.3 + seed * 2) * 0.3;
  }

  // ---------------------------------------------------------------------------
  // Particle system (cartoon sparks, glitches, coin pops)
  // ---------------------------------------------------------------------------
  const particles = [];

  function spawnParticles(x, y, color, n, speed, life) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = Math.random() * speed;
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - Math.random() * 2,
        life: life || 30 + Math.random() * 20,
        max: life || 40,
        color: color || "#0ff",
        size: 2 + Math.random() * 3,
        gravity: 0.08
      });
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawParticles(camX) {
    for (const p of particles) {
      const a = clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - camX - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  // ---------------------------------------------------------------------------
  // Floating text (score pops)
  // ---------------------------------------------------------------------------
  const floatTexts = [];

  function addFloat(x, y, text, color) {
    floatTexts.push({ x, y, text, color: color || "#fff", life: 50, vy: -1.2 });
  }

  function updateFloats() {
    for (let i = floatTexts.length - 1; i >= 0; i--) {
      const f = floatTexts[i];
      f.y += f.vy;
      f.life--;
      if (f.life <= 0) floatTexts.splice(i, 1);
    }
  }

  function drawFloats(camX) {
    ctx.font = "bold 14px Courier New";
    ctx.textAlign = "center";
    for (const f of floatTexts) {
      ctx.globalAlpha = clamp(f.life / 50, 0, 1);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x - camX, f.y);
    }
    ctx.globalAlpha = 1;
  }

  // ---------------------------------------------------------------------------
  // Level geometry — platforms, hazards, checkpoints, tokens, enemies
  // Zones: beach (0–2800), server room (2800–5600), cyber terminal (5600–end)
  // ---------------------------------------------------------------------------
  function buildLevel() {
    const platforms = [];
    const tokens = [];
    const enemies = [];
    const checkpoints = [];
    const decorations = [];

    // Ground segments with gaps
    const groundSegs = [
      [0, 1200], [1280, 900], [2300, 700],
      [3100, 1100], [4300, 800], [5200, 600],
      [5900, 900], [6900, 700], [7700, 600],
      [8400, 900] // boss arena floor
    ];
    for (const [x, w] of groundSegs) {
      platforms.push({ x, y: GROUND_Y, w, h: 80, type: "ground" });
    }

    // Floating platforms — beach
    const beachPlats = [
      [200, 380, 120], [400, 320, 100], [580, 360, 90],
      [780, 300, 110], [980, 340, 80], [1400, 360, 140],
      [1600, 280, 100], [1800, 320, 120], [2000, 260, 90],
      [2500, 340, 130], [2700, 280, 100]
    ];
    for (const [x, y, w] of beachPlats) {
      platforms.push({ x, y, w, h: 18, type: "plat" });
    }

    // Server room platforms
    const serverPlats = [
      [3200, 380, 100], [3400, 300, 80], [3600, 340, 120],
      [3800, 250, 90], [4000, 320, 110], [4200, 280, 80],
      [4500, 360, 100], [4700, 290, 90], [4900, 330, 130],
      [5100, 250, 80], [5400, 310, 100]
    ];
    for (const [x, y, w] of serverPlats) {
      platforms.push({ x, y, w, h: 16, type: "server" });
    }

    // Cyber terminal platforms
    const cyberPlats = [
      [6000, 370, 110], [6200, 290, 90], [6400, 330, 100],
      [6600, 250, 80], [6800, 310, 120], [7100, 280, 90],
      [7300, 350, 100], [7500, 260, 80], [7900, 320, 110],
      [8100, 280, 90], [8300, 360, 100]
    ];
    for (const [x, y, w] of cyberPlats) {
      platforms.push({ x, y, w, h: 16, type: "cyber" });
    }

    // Checkpoints
    const cpXs = [1500, 3600, 5800, 7800];
    for (const x of cpXs) {
      checkpoints.push({ x, y: GROUND_Y - 60, w: 20, h: 60, active: false });
    }

    // Tokens (collectibles)
    const tokenSpots = [];
    for (let i = 0; i < 55; i++) {
      const x = 180 + i * 160 + irand(-30, 30);
      if (x > WORLD_END - 400) break;
      // Place above platforms or ground-ish
      let y = GROUND_Y - 50 - irand(0, 180);
      // Prefer sitting on floating plats if nearby
      for (const p of platforms) {
        if (p.type !== "ground" && x >= p.x && x <= p.x + p.w) {
          y = p.y - 28;
          break;
        }
      }
      tokenSpots.push({ x, y, w: 14, h: 14, taken: false, phase: Math.random() * Math.PI * 2 });
    }
    tokens.push(...tokenSpots);

    // Enemies: shellfish, terminals, error bubbles
    function addEnemy(type, x, y, opts = {}) {
      const base = {
        type, x, y,
        vx: opts.vx ?? (Math.random() < 0.5 ? -1 : 1) * (opts.spd || 1.2),
        vy: 0,
        hp: opts.hp || 1,
        maxHp: opts.hp || 1,
        hurt: 0,
        phase: Math.random() * 10,
        dead: false,
        facing: 1,
        range: opts.range || 80,
        originX: x,
        ...opts
      };
      if (type === "shellfish") {
        base.w = 28; base.h = 22;
      } else if (type === "terminal") {
        base.w = 30; base.h = 36; base.hp = 2; base.maxHp = 2;
      } else if (type === "bubble") {
        base.w = 22; base.h = 22; base.vx = 0; base.float = true;
      }
      enemies.push(base);
    }

    // Beach enemies
    for (let x = 350; x < 2700; x += 280 + irand(0, 80)) {
      addEnemy("shellfish", x, GROUND_Y - 22, { spd: 1 + Math.random() * 0.6 });
    }
    addEnemy("bubble", 500, 300, {});
    addEnemy("bubble", 1100, 250, {});
    addEnemy("bubble", 1900, 280, {});
    addEnemy("terminal", 1600, GROUND_Y - 36, { spd: 0.8 });
    addEnemy("terminal", 2400, GROUND_Y - 36, { spd: 0.9 });

    // Server enemies
    for (let x = 3300; x < 5400; x += 320 + irand(0, 60)) {
      const t = Math.random();
      if (t < 0.4) addEnemy("shellfish", x, GROUND_Y - 22, { spd: 1.3 });
      else if (t < 0.75) addEnemy("terminal", x, GROUND_Y - 36, { spd: 0.9 });
      else addEnemy("bubble", x, 260 + irand(0, 100), {});
    }
    addEnemy("bubble", 3800, 220, {});
    addEnemy("bubble", 4600, 240, {});
    addEnemy("terminal", 4000, 320 - 36, { spd: 0.7 });

    // Cyber enemies
    for (let x = 6000; x < 8300; x += 300 + irand(0, 70)) {
      const t = Math.random();
      if (t < 0.35) addEnemy("shellfish", x, GROUND_Y - 22, { spd: 1.5 });
      else if (t < 0.7) addEnemy("terminal", x, GROUND_Y - 36, { spd: 1.1 });
      else addEnemy("bubble", x, 240 + irand(0, 80), {});
    }
    addEnemy("bubble", 6500, 200, {});
    addEnemy("bubble", 7200, 230, {});
    addEnemy("bubble", 8000, 210, {});

    // Decoration markers for drawing (racks, palm trees, etc.)
    for (let x = 50; x < 2800; x += 180 + irand(0, 40)) {
      decorations.push({ kind: "palm", x, y: GROUND_Y });
    }
    for (let x = 3100; x < 5600; x += 140) {
      decorations.push({ kind: "rack", x, y: GROUND_Y });
    }
    for (let x = 5900; x < 8400; x += 160) {
      decorations.push({ kind: "pillar", x, y: GROUND_Y });
    }

    return { platforms, tokens, enemies, checkpoints, decorations };
  }

  // ---------------------------------------------------------------------------
  // Player — Hermes Agent (hooded terminal explorer)
  // ---------------------------------------------------------------------------
  function createPlayer(x, y) {
    return {
      x, y,
      w: 22,
      h: 32,
      vx: 0,
      vy: 0,
      onGround: false,
      facing: 1,
      hp: 5,
      maxHp: 5,
      invuln: 0,
      tokens: 0,
      score: 0,
      anim: 0,
      shootCd: 0,
      checkpoint: { x: 80, y: GROUND_Y - 32 }
    };
  }

  // ---------------------------------------------------------------------------
  // Projectiles (prompt bolts)
  // ---------------------------------------------------------------------------
  const bolts = [];

  function tryShoot() {
    if (game.state !== STATE.PLAY) return;
    const p = game.player;
    if (p.shootCd > 0) return;
    p.shootCd = BOLT_COOLDOWN;
    bolts.push({
      x: p.x + (p.facing > 0 ? p.w : -8),
      y: p.y + p.h * 0.4,
      w: 12,
      h: 6,
      vx: p.facing * BOLT_SPEED,
      life: 55,
      fromPlayer: true
    });
    // muzzle spark
    spawnParticles(
      p.x + (p.facing > 0 ? p.w : 0),
      p.y + p.h * 0.4,
      "#7dffb3",
      4,
      3,
      15
    );
  }

  // ---------------------------------------------------------------------------
  // Boss — Cyber Lobster
  // ---------------------------------------------------------------------------
  function createBoss() {
    return {
      x: BOSS_X + 280,
      y: GROUND_Y - 90,
      w: 110,
      h: 90,
      hp: 28,
      maxHp: 28,
      vx: -0.8,
      phase: 0,
      attackCd: 120,
      hurt: 0,
      dead: false,
      glitch: 0,
      intro: true,
      introT: 0,
      facing: -1,
      clawSwing: 0
    };
  }

  const bossBubbles = []; // falling glitch attack projectiles

  function bossAttack(boss) {
    // Spawn falling glitch bubbles in a pattern
    const count = 4 + Math.floor(Math.random() * 3);
    for (let i = 0; i < count; i++) {
      const bx = boss.x - 40 + Math.random() * (boss.w + 200) - 80;
      bossBubbles.push({
        x: bx,
        y: boss.y - 40 - Math.random() * 80,
        w: 18,
        h: 18,
        vy: 1.5 + Math.random() * 1.5,
        vx: (Math.random() - 0.5) * 1.5,
        life: 180,
        phase: Math.random() * 10
      });
    }
    // Occasional horizontal claw bolt
    if (Math.random() < 0.45) {
      bolts.push({
        x: boss.facing < 0 ? boss.x : boss.x + boss.w,
        y: boss.y + 40,
        w: 16,
        h: 10,
        vx: boss.facing * 6,
        life: 70,
        fromPlayer: false,
        color: "#ff4488"
      });
    }
    boss.clawSwing = 20;
  }

  // ---------------------------------------------------------------------------
  // Game state object
  // ---------------------------------------------------------------------------
  let game = null;

  function startGame() {
    const level = buildLevel();
    game = {
      state: STATE.PLAY,
      player: createPlayer(80, GROUND_Y - 32),
      ...level,
      boss: createBoss(),
      bossActive: false,
      camX: 0,
      time: 0,
      shake: 0,
      message: "",
      messageT: 0
    };
    bolts.length = 0;
    particles.length = 0;
    floatTexts.length = 0;
    bossBubbles.length = 0;
  }

  function initTitle() {
    game = {
      state: STATE.START,
      player: createPlayer(80, GROUND_Y - 32),
      platforms: [],
      tokens: [],
      enemies: [],
      checkpoints: [],
      decorations: [],
      boss: createBoss(),
      bossActive: false,
      camX: 0,
      time: 0,
      shake: 0,
      message: "",
      messageT: 0
    };
  }

  // ---------------------------------------------------------------------------
  // Physics & collisions
  // ---------------------------------------------------------------------------
  function solidAt(rect, platforms) {
    for (const p of platforms) {
      if (rectOverlap(rect, p)) return p;
    }
    return null;
  }

  function moveActor(actor, platforms) {
    // Horizontal
    actor.x += actor.vx;
    let hit = solidAt(actor, platforms);
    if (hit) {
      if (actor.vx > 0) actor.x = hit.x - actor.w;
      else if (actor.vx < 0) actor.x = hit.x + hit.w;
      actor.vx = 0;
    }

    // Vertical
    actor.y += actor.vy;
    actor.onGround = false;
    hit = solidAt(actor, platforms);
    if (hit) {
      if (actor.vy > 0) {
        actor.y = hit.y - actor.h;
        actor.onGround = true;
      } else if (actor.vy < 0) {
        actor.y = hit.y + hit.h;
      }
      actor.vy = 0;
    }

    // Fall off world
    if (actor.y > H + 100) {
      return "fall";
    }
    return null;
  }

  // ---------------------------------------------------------------------------
  // Update loop
  // ---------------------------------------------------------------------------
  function update(dt) {
    if (!game) return;
    game.time++;

    if (game.state !== STATE.PLAY) return;

    const p = game.player;
    p.anim++;
    if (p.invuln > 0) p.invuln--;
    if (p.shootCd > 0) p.shootCd -= dt;
    if (game.shake > 0) game.shake *= 0.9;
    if (game.messageT > 0) game.messageT--;

    // --- Input ---
    let move = 0;
    if (keys["ArrowLeft"] || keys["KeyA"]) move -= 1;
    if (keys["ArrowRight"] || keys["KeyD"]) move += 1;
    p.vx += move * 0.9;
    p.vx *= FRICTION;
    if (Math.abs(p.vx) < 0.05) p.vx = 0;
    p.vx = clamp(p.vx, -MOVE_SPEED, MOVE_SPEED);
    if (move !== 0) p.facing = move > 0 ? 1 : -1;

    // Jump
    if ((keys["Space"] || keys["ArrowUp"] || keys["KeyW"]) && p.onGround) {
      p.vy = JUMP_V;
      p.onGround = false;
      spawnParticles(p.x + p.w / 2, p.y + p.h, "#88eeff", 5, 2.5, 18);
    }

    // Shoot
    if (keys["KeyJ"] || mouseDown) tryShoot();

    // Gravity
    p.vy = Math.min(p.vy + GRAVITY, MAX_FALL);

    // Move player
    const fall = moveActor(p, game.platforms);
    if (fall === "fall") {
      hurtPlayer(2);
      // Respawn at checkpoint
      p.x = p.checkpoint.x;
      p.y = p.checkpoint.y;
      p.vx = 0;
      p.vy = 0;
    }

    // Keep in world bounds
    p.x = clamp(p.x, 0, WORLD_END + 400);

    // --- Camera ---
    const targetCam = p.x - W * 0.35;
    game.camX += (targetCam - game.camX) * 0.12;
    game.camX = clamp(game.camX, 0, WORLD_END - W + 200);

    // --- Tokens ---
    for (const t of game.tokens) {
      if (t.taken) continue;
      t.phase += 0.08;
      if (rectOverlap(p, { x: t.x, y: t.y + Math.sin(t.phase) * 4, w: t.w, h: t.h })) {
        t.taken = true;
        p.tokens++;
        p.score += 50;
        addFloat(t.x, t.y, "+50", "#ffe066");
        spawnParticles(t.x, t.y, "#ffe066", 8, 3, 25);
      }
    }

    // --- Checkpoints ---
    for (const cp of game.checkpoints) {
      if (!cp.active && rectOverlap(p, cp)) {
        cp.active = true;
        p.checkpoint = { x: cp.x, y: GROUND_Y - p.h };
        game.message = "CHECKPOINT SAVED";
        game.messageT = 90;
        spawnParticles(cp.x + 10, cp.y + 20, "#00ffc8", 12, 3, 30);
        p.score += 100;
      }
    }

    // --- Enemies ---
    for (const e of game.enemies) {
      if (e.dead) continue;
      if (e.hurt > 0) e.hurt--;
      e.phase += 0.05;

      if (e.type === "bubble") {
        e.y += Math.sin(e.phase * 2) * 0.6;
        e.x += Math.cos(e.phase) * 0.4;
      } else {
        e.x += e.vx;
        // Patrol range
        if (Math.abs(e.x - e.originX) > e.range) e.vx *= -1;
        // Face direction
        e.facing = e.vx >= 0 ? 1 : -1;
        // Simple ground stick
        e.y = GROUND_Y - e.h;
        // Flip at platform edges (rough)
        const foot = { x: e.x + (e.vx > 0 ? e.w + 2 : -4), y: e.y + e.h + 2, w: 4, h: 4 };
        let onPlat = false;
        for (const pl of game.platforms) {
          if (rectOverlap(foot, pl)) { onPlat = true; break; }
        }
        if (!onPlat) e.vx *= -1;
      }

      // Touch damage
      if (e.hurt <= 0 && p.invuln <= 0 && rectOverlap(p, e)) {
        hurtPlayer(1);
        p.vx = (p.x < e.x ? -1 : 1) * 4;
        p.vy = -5;
      }
    }

    // --- Bolts ---
    for (let i = bolts.length - 1; i >= 0; i--) {
      const b = bolts[i];
      b.x += b.vx;
      b.life--;
      if (b.life <= 0) { bolts.splice(i, 1); continue; }

      // Hit platforms
      if (solidAt(b, game.platforms)) {
        spawnParticles(b.x, b.y, b.color || "#7dffb3", 4, 2, 12);
        bolts.splice(i, 1);
        continue;
      }

      if (b.fromPlayer) {
        // Hit enemies
        let hit = false;
        for (const e of game.enemies) {
          if (e.dead || e.hurt > 0) continue;
          if (rectOverlap(b, e)) {
            e.hp--;
            e.hurt = 12;
            spawnParticles(e.x + e.w / 2, e.y + e.h / 2, "#ff88aa", 6, 3, 20);
            if (e.hp <= 0) {
              e.dead = true;
              const pts = e.type === "terminal" ? 150 : e.type === "bubble" ? 80 : 100;
              p.score += pts;
              addFloat(e.x, e.y, "+" + pts, "#ff88ff");
              spawnParticles(e.x + e.w / 2, e.y + e.h / 2, "#ff66cc", 14, 4, 30);
            }
            hit = true;
            break;
          }
        }
        // Hit boss
        if (!hit && game.bossActive && !game.boss.dead && rectOverlap(b, game.boss)) {
          game.boss.hp--;
          game.boss.hurt = 10;
          game.boss.glitch = 15;
          p.score += 25;
          spawnParticles(b.x, b.y, "#ff2244", 8, 4, 22);
          game.shake = 6;
          if (game.boss.hp <= 0) {
            game.boss.dead = true;
            game.boss.hp = 0;
            p.score += 2000;
            addFloat(game.boss.x + 40, game.boss.y, "+2000 BOSS!", "#ffee00");
            spawnParticles(game.boss.x + 55, game.boss.y + 40, "#ff4488", 40, 6, 50);
            spawnParticles(game.boss.x + 55, game.boss.y + 40, "#00ffc8", 30, 5, 45);
            game.shake = 18;
            setTimeout(() => {
              if (game && game.boss && game.boss.dead) {
                game.state = STATE.WIN;
              }
            }, 1400);
          }
          hit = true;
        }
        if (hit) bolts.splice(i, 1);
      } else {
        // Enemy/boss bolt hits player
        if (p.invuln <= 0 && rectOverlap(b, p)) {
          hurtPlayer(1);
          bolts.splice(i, 1);
          spawnParticles(p.x + p.w / 2, p.y + p.h / 2, "#ff6688", 8, 3, 20);
        }
      }
    }

    // --- Boss activation & AI ---
    if (!game.bossActive && p.x >= BOSS_X - 100) {
      game.bossActive = true;
      game.message = "⚠ CYBER-LOBSTER DETECTED ⚠";
      game.messageT = 120;
    }

    if (game.bossActive && !game.boss.dead) {
      updateBoss(game.boss);
    }

    // Boss bubbles
    for (let i = bossBubbles.length - 1; i >= 0; i--) {
      const bb = bossBubbles[i];
      bb.phase += 0.1;
      bb.y += bb.vy;
      bb.x += bb.vx + Math.sin(bb.phase) * 0.5;
      bb.life--;
      if (bb.life <= 0 || bb.y > H + 20) {
        bossBubbles.splice(i, 1);
        continue;
      }
      if (p.invuln <= 0 && rectOverlap(p, bb)) {
        hurtPlayer(1);
        spawnParticles(bb.x, bb.y, "#cc44ff", 6, 3, 18);
        bossBubbles.splice(i, 1);
      }
    }

    updateParticles();
    updateFloats();
  }

  function hurtPlayer(amount) {
    const p = game.player;
    if (p.invuln > 0) return;
    p.hp -= amount;
    p.invuln = 70;
    game.shake = 8;
    spawnParticles(p.x + p.w / 2, p.y + p.h / 2, "#ff4466", 10, 3.5, 25);
    if (p.hp <= 0) {
      p.hp = 0;
      game.state = STATE.OVER;
      spawnParticles(p.x + p.w / 2, p.y + p.h / 2, "#ff2244", 25, 5, 40);
    }
  }

  function updateBoss(boss) {
    boss.phase += 0.04;
    if (boss.hurt > 0) boss.hurt--;
    if (boss.glitch > 0) boss.glitch--;
    if (boss.clawSwing > 0) boss.clawSwing--;

    // Intro rise
    if (boss.intro) {
      boss.introT++;
      boss.y = GROUND_Y - 90 + Math.sin(boss.introT * 0.1) * 4;
      if (boss.introT > 60) boss.intro = false;
      return;
    }

    // Patrol left-right in arena
    boss.x += boss.vx;
    const arenaLeft = BOSS_X + 40;
    const arenaRight = BOSS_X + 700;
    if (boss.x < arenaLeft) { boss.x = arenaLeft; boss.vx = Math.abs(boss.vx); }
    if (boss.x + boss.w > arenaRight) { boss.x = arenaRight - boss.w; boss.vx = -Math.abs(boss.vx); }
    boss.facing = boss.vx >= 0 ? 1 : -1;

    // Bob
    boss.y = GROUND_Y - 90 + Math.sin(boss.phase * 3) * 6;

    // Speed up when low HP
    const ratio = boss.hp / boss.maxHp;
    const baseSpd = ratio < 0.35 ? 1.6 : ratio < 0.65 ? 1.2 : 0.85;
    boss.vx = Math.sign(boss.vx || -1) * baseSpd;

    // Attacks
    boss.attackCd--;
    if (boss.attackCd <= 0) {
      bossAttack(boss);
      boss.attackCd = ratio < 0.35 ? 55 : ratio < 0.65 ? 80 : 110;
    }

    // Contact damage
    const p = game.player;
    if (p.invuln <= 0 && rectOverlap(p, boss)) {
      hurtPlayer(1);
      p.vx = (p.x < boss.x + boss.w / 2 ? -1 : 1) * 5;
      p.vy = -6;
    }
  }

  // ---------------------------------------------------------------------------
  // Drawing — backgrounds, entities, UI
  // ---------------------------------------------------------------------------
  function zoneAt(x) {
    if (x < 2800) return "beach";
    if (x < 5600) return "server";
    return "cyber";
  }

  function drawBackground(camX, t) {
    // Sky gradient by zone blend
    const mid = camX + W / 2;
    const zone = zoneAt(mid);

    let top, bot, accent;
    if (zone === "beach") {
      top = "#1a1040"; bot = "#ff7a4a"; accent = "#ffcc66";
    } else if (zone === "server") {
      top = "#0a1020"; bot = "#0d2a3a"; accent = "#00ffc8";
    } else {
      top = "#100818"; bot = "#2a0840"; accent = "#ff44aa";
    }

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, top);
    g.addColorStop(0.55, bot);
    g.addColorStop(1, "#050510");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Stars / data bits (far parallax)
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    for (let i = 0; i < 60; i++) {
      const sx = ((i * 137 + 50) - camX * 0.05) % W;
      const sy = (i * 97) % (H * 0.55);
      const tw = 0.4 + 0.6 * Math.abs(Math.sin(t * 0.05 + i));
      ctx.globalAlpha = tw * 0.7;
      ctx.fillRect(sx < 0 ? sx + W : sx, sy, 2, 2);
    }
    ctx.globalAlpha = 1;

    // Parallax layer 2 — distant hills / server silhouettes
    const p2 = camX * 0.2;
    if (zone === "beach") {
      ctx.fillStyle = "#2a1848";
      ctx.beginPath();
      ctx.moveTo(0, H * 0.65);
      for (let x = 0; x <= W; x += 20) {
        const wx = x + p2;
        const y = H * 0.58 + Math.sin(wx * 0.01) * 25 + Math.sin(wx * 0.023) * 12;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H);
      ctx.lineTo(0, H);
      ctx.fill();
      // Sun/moon
      ctx.fillStyle = accent;
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.arc(W * 0.78 - (camX * 0.02) % 40, H * 0.22, 36, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.25;
      ctx.beginPath();
      ctx.arc(W * 0.78, H * 0.22, 55, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (zone === "server") {
      // Distant racks
      for (let i = 0; i < 18; i++) {
        const rx = ((i * 90) - p2 * 1.2) % (W + 100) - 40;
        const rh = 80 + (i % 5) * 18;
        ctx.fillStyle = i % 2 ? "#0a2030" : "#0c1828";
        ctx.fillRect(rx, H * 0.55 - rh + 80, 40, rh);
        // blink lights
        if (Math.sin(t * 0.1 + i) > 0.3) {
          ctx.fillStyle = accent;
          ctx.globalAlpha = 0.6;
          ctx.fillRect(rx + 8, H * 0.55 - rh + 90, 4, 4);
          ctx.fillRect(rx + 20, H * 0.55 - rh + 100, 4, 4);
          ctx.globalAlpha = 1;
        }
      }
    } else {
      // Neon city grid
      ctx.strokeStyle = "rgba(255, 50, 150, 0.25)";
      ctx.lineWidth = 1;
      for (let i = 0; i < 12; i++) {
        const y = H * 0.4 + i * 18;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y + 10);
        ctx.stroke();
      }
      for (let i = -2; i < 16; i++) {
        const x = ((i * 70) - p2) % (W + 80);
        ctx.beginPath();
        ctx.moveTo(x, H * 0.4);
        ctx.lineTo(x + 30, H);
        ctx.stroke();
      }
      // Floating glyphs
      ctx.fillStyle = accent;
      ctx.font = "12px Courier New";
      ctx.globalAlpha = 0.35;
      for (let i = 0; i < 10; i++) {
        const gx = ((i * 110 + t * 0.5) - camX * 0.15) % W;
        const gy = 40 + (i * 37) % 200;
        ctx.fillText(["0xERR", "NULL", ">>>", "404", "GLITCH"][i % 5], gx, gy);
      }
      ctx.globalAlpha = 1;
    }

    // Mid parallax — waves / cables / code rain
    const p1 = camX * 0.45;
    if (zone === "beach") {
      // Water bands
      for (let band = 0; band < 4; band++) {
        ctx.fillStyle = band % 2 ? "rgba(30, 100, 160, 0.35)" : "rgba(20, 80, 140, 0.3)";
        ctx.beginPath();
        const baseY = H * 0.72 + band * 12;
        ctx.moveTo(0, baseY);
        for (let x = 0; x <= W; x += 12) {
          const y = baseY + Math.sin((x + p1) * 0.02 + t * 0.05 + band) * 6;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(W, H);
        ctx.lineTo(0, H);
        ctx.fill();
      }
    } else if (zone === "server") {
      // Cable arcs
      ctx.strokeStyle = "rgba(0, 255, 200, 0.15)";
      ctx.lineWidth = 2;
      for (let i = 0; i < 8; i++) {
        const cx = ((i * 140) - p1) % (W + 120);
        ctx.beginPath();
        ctx.moveTo(cx, H * 0.5);
        ctx.quadraticCurveTo(cx + 60, H * 0.35 + Math.sin(t * 0.03 + i) * 20, cx + 120, H * 0.55);
        ctx.stroke();
      }
    } else {
      // Code rain
      ctx.font = "11px Courier New";
      ctx.fillStyle = "rgba(180, 80, 255, 0.4)";
      for (let i = 0; i < 20; i++) {
        const cx = ((i * 55) - p1 * 0.5) % W;
        const cy = ((t * 2 + i * 40) % (H + 40)) - 20;
        ctx.fillText(String.fromCharCode(0x30A0 + (i * 7 + Math.floor(t / 4)) % 90), cx, cy);
      }
    }
  }

  function drawDecorations(camX) {
    for (const d of game.decorations) {
      const sx = d.x - camX;
      if (sx < -80 || sx > W + 80) continue;
      if (d.kind === "palm") {
        // Trunk
        ctx.fillStyle = "#5a3820";
        ctx.fillRect(sx + 6, d.y - 70, 8, 70);
        // Leaves
        ctx.fillStyle = "#2d8a4e";
        ctx.beginPath();
        ctx.ellipse(sx + 10, d.y - 75, 28, 10, -0.4, 0, Math.PI * 2);
        ctx.ellipse(sx + 10, d.y - 72, 26, 9, 0.5, 0, Math.PI * 2);
        ctx.ellipse(sx + 10, d.y - 80, 18, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        // Digital coconuts
        ctx.fillStyle = "#00ffc8";
        ctx.fillRect(sx + 8, d.y - 68, 5, 5);
      } else if (d.kind === "rack") {
        ctx.fillStyle = "#1a2838";
        ctx.fillRect(sx, d.y - 100, 36, 100);
        ctx.strokeStyle = "#00ffc8";
        ctx.lineWidth = 1;
        ctx.strokeRect(sx, d.y - 100, 36, 100);
        for (let r = 0; r < 6; r++) {
          ctx.fillStyle = Math.sin(game.time * 0.08 + d.x + r) > 0 ? "#0f0" : "#040";
          ctx.fillRect(sx + 6, d.y - 90 + r * 14, 8, 5);
          ctx.fillStyle = Math.sin(game.time * 0.1 + d.x * 0.5 + r) > 0.2 ? "#f80" : "#420";
          ctx.fillRect(sx + 20, d.y - 90 + r * 14, 8, 5);
        }
      } else if (d.kind === "pillar") {
        ctx.fillStyle = "#2a1040";
        ctx.fillRect(sx, d.y - 120, 18, 120);
        ctx.fillStyle = "#ff44aa";
        ctx.globalAlpha = 0.5 + 0.3 * Math.sin(game.time * 0.1 + d.x);
        ctx.fillRect(sx + 2, d.y - 118, 14, 4);
        ctx.fillRect(sx + 2, d.y - 60, 14, 4);
        ctx.globalAlpha = 1;
        // Holo ring
        ctx.strokeStyle = "rgba(255, 68, 170, 0.4)";
        ctx.beginPath();
        ctx.ellipse(sx + 9, d.y - 90, 20, 6, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }

  function drawPlatforms(camX) {
    for (const pl of game.platforms) {
      const sx = pl.x - camX;
      if (sx + pl.w < -10 || sx > W + 10) continue;

      if (pl.type === "ground") {
        // Sand / floor by zone
        const z = zoneAt(pl.x + pl.w / 2);
        if (z === "beach") {
          ctx.fillStyle = "#e8c070";
          ctx.fillRect(sx, pl.y, pl.w, pl.h);
          ctx.fillStyle = "#c9a050";
          ctx.fillRect(sx, pl.y, pl.w, 6);
          // Shell pebbles
          ctx.fillStyle = "#fff8e0";
          for (let i = 0; i < pl.w; i += 28) {
            ctx.fillRect(sx + i + 4, pl.y + 12, 4, 3);
          }
        } else if (z === "server") {
          ctx.fillStyle = "#1a3040";
          ctx.fillRect(sx, pl.y, pl.w, pl.h);
          ctx.fillStyle = "#00ffc8";
          ctx.fillRect(sx, pl.y, pl.w, 3);
          ctx.fillStyle = "#0a1820";
          for (let i = 0; i < pl.w; i += 20) {
            ctx.fillRect(sx + i, pl.y + 10, 14, 2);
          }
        } else {
          ctx.fillStyle = "#201030";
          ctx.fillRect(sx, pl.y, pl.w, pl.h);
          ctx.fillStyle = "#ff44aa";
          ctx.fillRect(sx, pl.y, pl.w, 3);
          ctx.fillStyle = "#00e0ff";
          ctx.fillRect(sx, pl.y + 4, pl.w, 1);
        }
      } else {
        // Floating platform styles
        if (pl.type === "plat") {
          ctx.fillStyle = "#d4a84a";
          ctx.fillRect(sx, pl.y, pl.w, pl.h);
          ctx.fillStyle = "#8fd4ff";
          ctx.fillRect(sx + 2, pl.y + 2, pl.w - 4, 4);
        } else if (pl.type === "server") {
          ctx.fillStyle = "#143040";
          ctx.fillRect(sx, pl.y, pl.w, pl.h);
          ctx.fillStyle = "#00ffc8";
          ctx.fillRect(sx, pl.y, pl.w, 3);
          ctx.fillStyle = "#ffaa00";
          ctx.fillRect(sx + 4, pl.y + 8, 6, 4);
        } else {
          ctx.fillStyle = "#301848";
          ctx.fillRect(sx, pl.y, pl.w, pl.h);
          ctx.fillStyle = "#ff44aa";
          ctx.fillRect(sx, pl.y, pl.w, 3);
          ctx.fillStyle = "#88ffee";
          ctx.globalAlpha = 0.5 + 0.3 * Math.sin(game.time * 0.1 + pl.x);
          ctx.fillRect(sx + 2, pl.y + 6, pl.w - 4, 2);
          ctx.globalAlpha = 1;
        }
      }
    }
  }

  function drawCheckpoints(camX) {
    for (const cp of game.checkpoints) {
      const sx = cp.x - camX;
      if (sx < -30 || sx > W + 30) continue;
      // Pole
      ctx.fillStyle = "#888";
      ctx.fillRect(sx + 8, cp.y, 4, cp.h);
      // Flag
      const col = cp.active ? "#00ffc8" : "#ff6688";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(sx + 12, cp.y);
      ctx.lineTo(sx + 12 + 22 + Math.sin(game.time * 0.1) * 3, cp.y + 10);
      ctx.lineTo(sx + 12, cp.y + 20);
      ctx.fill();
      if (cp.active) {
        ctx.shadowColor = col;
        ctx.shadowBlur = 10;
        ctx.fillRect(sx + 6, cp.y - 4, 8, 4);
        ctx.shadowBlur = 0;
      }
    }
  }

  function drawTokens(camX) {
    for (const t of game.tokens) {
      if (t.taken) continue;
      const bob = Math.sin(t.phase) * 4;
      const sx = t.x - camX;
      if (sx < -20 || sx > W + 20) continue;
      // Spinning token (diamond + glow)
      ctx.save();
      ctx.translate(sx + t.w / 2, t.y + bob + t.h / 2);
      ctx.rotate(t.phase * 0.5);
      ctx.shadowColor = "#ffe066";
      ctx.shadowBlur = 8;
      ctx.fillStyle = "#ffe066";
      ctx.beginPath();
      ctx.moveTo(0, -8);
      ctx.lineTo(7, 0);
      ctx.lineTo(0, 8);
      ctx.lineTo(-7, 0);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#fff8c0";
      ctx.beginPath();
      ctx.moveTo(0, -4);
      ctx.lineTo(3, 0);
      ctx.lineTo(0, 4);
      ctx.lineTo(-3, 0);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }

  // Draw Hermes Agent — hooded terminal explorer with glowing eyes + cape
  function drawPlayer(camX) {
    const p = game.player;
    if (p.invuln > 0 && Math.floor(p.invuln / 3) % 2 === 0) return; // flicker

    const sx = p.x - camX;
    const sy = p.y;
    const f = p.facing;
    const run = p.onGround && Math.abs(p.vx) > 0.4;
    const bob = run ? Math.sin(p.anim * 0.4) * 2 : 0;
    const leg = run ? Math.sin(p.anim * 0.45) * 4 : 0;

    ctx.save();
    ctx.translate(sx + p.w / 2, sy + bob);
    ctx.scale(f, 1);

    // Cape
    ctx.fillStyle = "#5b2d9e";
    ctx.beginPath();
    ctx.moveTo(-4, 4);
    ctx.quadraticCurveTo(-14 - Math.sin(p.anim * 0.15) * 3, 14, -10, 28);
    ctx.lineTo(-2, 22);
    ctx.lineTo(2, 8);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#7b4dce";
    ctx.beginPath();
    ctx.moveTo(-3, 6);
    ctx.quadraticCurveTo(-10, 16, -7, 24);
    ctx.lineTo(-1, 18);
    ctx.fill();

    // Body (cloak/robe)
    ctx.fillStyle = "#2a1a40";
    ctx.fillRect(-9, 6, 18, 18);
    // Belt terminal strip
    ctx.fillStyle = "#00ffc8";
    ctx.fillRect(-7, 16, 14, 3);
    ctx.fillStyle = "#0a0";
    ctx.fillRect(-5, 17, 3, 1);
    ctx.fillRect(-1, 17, 3, 1);
    ctx.fillRect(3, 17, 2, 1);

    // Legs
    ctx.fillStyle = "#1a1028";
    ctx.fillRect(-7, 22, 5, 10 + leg);
    ctx.fillRect(2, 22, 5, 10 - leg);
    // Boots
    ctx.fillStyle = "#00c8a0";
    ctx.fillRect(-8, 30 + leg, 7, 3);
    ctx.fillRect(1, 30 - leg, 7, 3);

    // Arms
    ctx.fillStyle = "#2a1a40";
    const armSwing = run ? Math.sin(p.anim * 0.45) * 3 : 0;
    ctx.fillRect(-12, 8 + armSwing, 4, 10);
    ctx.fillRect(8, 8 - armSwing, 4, 10);
    // Prompt bolt hand glow
    ctx.fillStyle = "#7dffb3";
    ctx.globalAlpha = 0.8;
    ctx.fillRect(9, 14 - armSwing, 5, 4);
    ctx.globalAlpha = 1;

    // Hood
    ctx.fillStyle = "#1a0f30";
    ctx.beginPath();
    ctx.ellipse(0, 2, 11, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    // Hood opening
    ctx.fillStyle = "#0d0818";
    ctx.beginPath();
    ctx.ellipse(1, 3, 7, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // Glowing eyes
    const eyeGlow = 0.7 + 0.3 * Math.sin(game.time * 0.15);
    ctx.shadowColor = "#00ffc8";
    ctx.shadowBlur = 8 * eyeGlow;
    ctx.fillStyle = "#00ffc8";
    ctx.fillRect(-3, 1, 3, 3);
    ctx.fillRect(3, 1, 3, 3);
    ctx.fillStyle = "#e0ffff";
    ctx.fillRect(-2, 1, 1, 1);
    ctx.fillRect(4, 1, 1, 1);
    ctx.shadowBlur = 0;

    // Tiny antenna / terminal horn
    ctx.strokeStyle = "#00ffc8";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.lineTo(0, -14);
    ctx.stroke();
    ctx.fillStyle = "#ff44aa";
    ctx.beginPath();
    ctx.arc(0, -15, 2.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawEnemies(camX) {
    for (const e of game.enemies) {
      if (e.dead) continue;
      const sx = e.x - camX;
      if (sx < -40 || sx > W + 40) continue;
      const flash = e.hurt > 0 && Math.floor(e.hurt / 2) % 2 === 0;

      if (e.type === "shellfish") {
        // Corrupted shellfish — cartoon crab-ish
        ctx.save();
        ctx.translate(sx + e.w / 2, e.y + e.h / 2);
        ctx.scale(e.facing, 1);
        ctx.fillStyle = flash ? "#fff" : "#e07050";
        // Shell
        ctx.beginPath();
        ctx.ellipse(0, 0, 14, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = flash ? "#fcc" : "#c05040";
        ctx.beginPath();
        ctx.ellipse(0, -2, 10, 6, 0, Math.PI, Math.PI * 2);
        ctx.fill();
        // Glitch cracks
        ctx.strokeStyle = "#00ffc8";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-6, -2);
        ctx.lineTo(-2, 2);
        ctx.lineTo(4, -1);
        ctx.stroke();
        // Eyes
        ctx.fillStyle = "#ff2266";
        ctx.fillRect(-6, -4, 3, 3);
        ctx.fillRect(3, -4, 3, 3);
        // Legs
        ctx.strokeStyle = flash ? "#fff" : "#a04030";
        ctx.lineWidth = 2;
        for (let i = -1; i <= 1; i++) {
          ctx.beginPath();
          ctx.moveTo(i * 6, 4);
          ctx.lineTo(i * 8 + Math.sin(e.phase * 4 + i) * 2, 11);
          ctx.stroke();
        }
        // Claws
        ctx.fillStyle = flash ? "#fff" : "#d06040";
        ctx.fillRect(-16, -2, 6, 5);
        ctx.fillRect(10, -2, 6, 5);
        ctx.restore();
      } else if (e.type === "terminal") {
        // Rogue terminal
        ctx.fillStyle = flash ? "#fff" : "#1a2830";
        ctx.fillRect(sx, e.y, e.w, e.h);
        ctx.strokeStyle = "#00ffc8";
        ctx.lineWidth = 2;
        ctx.strokeRect(sx, e.y, e.w, e.h);
        // Screen
        ctx.fillStyle = flash ? "#8f8" : "#003322";
        ctx.fillRect(sx + 4, e.y + 4, e.w - 8, 16);
        ctx.fillStyle = "#00ff88";
        ctx.font = "8px Courier New";
        ctx.fillText("ERR", sx + 6, e.y + 15);
        // Angry eyes
        ctx.fillStyle = "#ff2244";
        ctx.fillRect(sx + 6, e.y + 8, 4, 3);
        ctx.fillRect(sx + e.w - 12, e.y + 8, 4, 3);
        // Legs / wheels
        ctx.fillStyle = "#445";
        ctx.fillRect(sx + 4, e.y + e.h - 4, 6, 4);
        ctx.fillRect(sx + e.w - 10, e.y + e.h - 4, 6, 4);
        // Antenna
        ctx.strokeStyle = "#ff44aa";
        ctx.beginPath();
        ctx.moveTo(sx + e.w / 2, e.y);
        ctx.lineTo(sx + e.w / 2 + Math.sin(e.phase * 3) * 4, e.y - 8);
        ctx.stroke();
      } else if (e.type === "bubble") {
        // Floating error bubble
        const pulse = 1 + Math.sin(e.phase * 3) * 0.08;
        ctx.save();
        ctx.translate(sx + e.w / 2, e.y + e.h / 2);
        ctx.scale(pulse, pulse);
        ctx.fillStyle = flash ? "rgba(255,255,255,0.8)" : "rgba(200, 60, 255, 0.55)";
        ctx.beginPath();
        ctx.arc(0, 0, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#ff88ff";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = "#fff";
        ctx.font = "bold 9px Courier New";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("!", 0, 0);
        // Glitch offset copy
        if (Math.sin(e.phase * 8) > 0.7) {
          ctx.fillStyle = "rgba(0,255,200,0.4)";
          ctx.fillText("!", 2, -1);
        }
        ctx.restore();
      }
    }
  }

  function drawBolts(camX) {
    for (const b of bolts) {
      const sx = b.x - camX;
      if (b.fromPlayer) {
        ctx.shadowColor = "#7dffb3";
        ctx.shadowBlur = 8;
        ctx.fillStyle = "#b6ffe0";
        ctx.fillRect(sx, b.y, b.w, b.h);
        ctx.fillStyle = "#00ffc8";
        ctx.fillRect(sx + 2, b.y + 1, b.w - 3, b.h - 2);
        // Trail
        ctx.globalAlpha = 0.4;
        ctx.fillRect(sx - b.vx * 0.5, b.y + 1, 6, b.h - 2);
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
      } else {
        ctx.shadowColor = "#ff4488";
        ctx.shadowBlur = 8;
        ctx.fillStyle = b.color || "#ff4488";
        ctx.fillRect(sx, b.y, b.w, b.h);
        ctx.shadowBlur = 0;
      }
    }
  }

  function drawBossBubbles(camX) {
    for (const bb of bossBubbles) {
      const sx = bb.x - camX;
      const pulse = 1 + Math.sin(bb.phase * 4) * 0.12;
      ctx.save();
      ctx.translate(sx + bb.w / 2, bb.y + bb.h / 2);
      ctx.scale(pulse, pulse);
      // Glitch RGB split
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = "#ff0044";
      ctx.beginPath();
      ctx.arc(-2, 0, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#00ffcc";
      ctx.beginPath();
      ctx.arc(2, 0, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = "#cc66ff";
      ctx.beginPath();
      ctx.arc(0, 0, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.font = "bold 8px Courier New";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("?", 0, 1);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  // Huge distorted cyber-lobster
  function drawBoss(camX) {
    const b = game.boss;
    if (!game.bossActive && !b.dead) return;
    if (b.dead && b.hp <= 0) {
      // Death glitch fade
      if (Math.random() > 0.3) return;
    }

    let sx = b.x - camX;
    let sy = b.y;
    // Glitch offset
    if (b.glitch > 0) {
      sx += (Math.random() - 0.5) * 8;
      sy += (Math.random() - 0.5) * 4;
    }

    ctx.save();
    ctx.translate(sx + b.w / 2, sy + b.h / 2);
    ctx.scale(b.facing, 1);

    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath();
    ctx.ellipse(0, b.h / 2 - 4, 50, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // Tail segments
    ctx.fillStyle = b.hurt > 0 ? "#ffaaaa" : "#c04060";
    for (let i = 0; i < 4; i++) {
      const tx = 30 + i * 14;
      const ty = Math.sin(b.phase * 4 + i) * 4;
      ctx.beginPath();
      ctx.ellipse(tx, ty + 10, 12 - i, 9 - i * 0.5, 0.2, 0, Math.PI * 2);
      ctx.fill();
      // Armour plate
      ctx.strokeStyle = "#00ffc8";
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // Body shell (distorted)
    ctx.fillStyle = b.hurt > 0 ? "#ffcccc" : "#a03050";
    ctx.beginPath();
    ctx.ellipse(0, 5, 42, 32, -0.1, 0, Math.PI * 2);
    ctx.fill();
    // Shell armour plates
    ctx.fillStyle = b.hurt > 0 ? "#ffdddd" : "#702040";
    ctx.beginPath();
    ctx.ellipse(-5, -5, 30, 18, -0.15, Math.PI, Math.PI * 2);
    ctx.fill();
    // Neon seams
    ctx.strokeStyle = "#00ffc8";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-25, 0);
    ctx.lineTo(-5, -12);
    ctx.lineTo(15, -4);
    ctx.lineTo(25, 8);
    ctx.stroke();
    ctx.strokeStyle = "#ff44aa";
    ctx.beginPath();
    ctx.moveTo(-20, 10);
    ctx.lineTo(10, 15);
    ctx.stroke();

    // Mismatched claws
    const swing = b.clawSwing > 0 ? Math.sin(b.clawSwing * 0.5) * 0.4 : 0;
    // Big claw (left / front)
    ctx.save();
    ctx.translate(-40, 5);
    ctx.rotate(-0.3 + swing);
    ctx.fillStyle = b.hurt > 0 ? "#ffbbcc" : "#d05070";
    ctx.beginPath();
    ctx.ellipse(-18, 0, 22, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    // Pincer gap
    ctx.fillStyle = "#501028";
    ctx.fillRect(-30, -3, 16, 5);
    // Spikes on claw
    ctx.fillStyle = "#00ffc8";
    ctx.fillRect(-38, -8, 4, 4);
    ctx.fillRect(-38, 4, 4, 4);
    ctx.restore();

    // Small weird claw (right)
    ctx.save();
    ctx.translate(-35, 20);
    ctx.rotate(0.5 - swing * 0.5);
    ctx.fillStyle = b.hurt > 0 ? "#ffccdd" : "#8040a0";
    ctx.beginPath();
    ctx.ellipse(-10, 0, 12, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#00e0ff";
    ctx.fillRect(-18, -2, 8, 3);
    ctx.restore();

    // Legs
    ctx.strokeStyle = b.hurt > 0 ? "#fcc" : "#903050";
    ctx.lineWidth = 3;
    for (let i = 0; i < 4; i++) {
      const lx = -15 + i * 14;
      const ly = 28 + Math.sin(b.phase * 5 + i) * 3;
      ctx.beginPath();
      ctx.moveTo(lx, 20);
      ctx.lineTo(lx - 5, ly);
      ctx.lineTo(lx + 4, ly + 8);
      ctx.stroke();
    }

    // Head / face
    ctx.fillStyle = b.hurt > 0 ? "#ffdddd" : "#b03858";
    ctx.beginPath();
    ctx.ellipse(-28, -10, 18, 16, -0.2, 0, Math.PI * 2);
    ctx.fill();

    // Antennae
    ctx.strokeStyle = "#ff44aa";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-32, -22);
    ctx.quadraticCurveTo(-40, -40 + Math.sin(b.phase * 3) * 5, -48, -35);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-24, -24);
    ctx.quadraticCurveTo(-20, -42 + Math.cos(b.phase * 3) * 5, -12, -38);
    ctx.stroke();
    ctx.fillStyle = "#00ffc8";
    ctx.beginPath();
    ctx.arc(-48, -35, 3, 0, Math.PI * 2);
    ctx.arc(-12, -38, 3, 0, Math.PI * 2);
    ctx.fill();

    // Glowing mismatched eyes
    ctx.shadowColor = "#ff2244";
    ctx.shadowBlur = 12;
    ctx.fillStyle = "#ff2244";
    ctx.beginPath();
    ctx.ellipse(-34, -12, 5, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowColor = "#00ffc8";
    ctx.fillStyle = "#00ffc8";
    ctx.beginPath();
    ctx.ellipse(-22, -10, 4, 7, 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // Pupils
    ctx.fillStyle = "#000";
    ctx.fillRect(-35, -12, 2, 3);
    ctx.fillRect(-22, -11, 2, 3);

    // Mouth glitch bars
    ctx.fillStyle = "#200010";
    ctx.fillRect(-38, -2, 16, 6);
    ctx.fillStyle = "#ff4488";
    for (let i = 0; i < 4; i++) {
      const h = 2 + Math.sin(b.phase * 6 + i) * 2;
      ctx.fillRect(-36 + i * 4, -1, 2, h);
    }

    // RGB glitch copies when hurt
    if (b.glitch > 0) {
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = "#0ff";
      ctx.fillRect(-50 + 4, -40, 20, 15);
      ctx.fillStyle = "#f0f";
      ctx.fillRect(-50 - 4, -35, 18, 12);
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    // Name tag
    if (!b.dead) {
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.font = "bold 11px Courier New";
      ctx.textAlign = "center";
      ctx.fillText("CYBER-LOBSTER", b.x - camX + b.w / 2, b.y - 18);
    }
  }

  // ---------------------------------------------------------------------------
  // UI HUD
  // ---------------------------------------------------------------------------
  function drawHUD() {
    const p = game.player;

    // Top bar background
    ctx.fillStyle = "rgba(5, 5, 20, 0.65)";
    ctx.fillRect(0, 0, W, 48);

    // Title chip
    ctx.fillStyle = "#00ffc8";
    ctx.font = "bold 13px Courier New";
    ctx.textAlign = "left";
    ctx.fillText("GROK-4.5", 12, 18);
    ctx.fillStyle = "#ff88cc";
    ctx.font = "10px Courier New";
    ctx.fillText("HERMES AGENT", 12, 32);

    // Health hearts
    ctx.font = "14px Courier New";
    for (let i = 0; i < p.maxHp; i++) {
      ctx.fillStyle = i < p.hp ? "#ff4466" : "#333344";
      ctx.fillText(i < p.hp ? "♥" : "♡", 130 + i * 18, 28);
    }

    // Score
    ctx.fillStyle = "#e0f7ff";
    ctx.font = "bold 13px Courier New";
    ctx.textAlign = "left";
    ctx.fillText("SCORE " + String(p.score).padStart(6, "0"), 250, 22);

    // Tokens
    ctx.fillStyle = "#ffe066";
    ctx.fillText("◆ " + p.tokens, 250, 38);

    // Progress bar (journey to boss)
    const progress = clamp(p.x / BOSS_X, 0, 1);
    const barX = 400, barW = 280, barH = 10;
    ctx.fillStyle = "#1a1a30";
    ctx.fillRect(barX, 18, barW, barH);
    ctx.fillStyle = "#00ffc8";
    ctx.fillRect(barX, 18, barW * progress, barH);
    ctx.strokeStyle = "#448888";
    ctx.strokeRect(barX, 18, barW, barH);
    ctx.fillStyle = "#88aaaa";
    ctx.font = "9px Courier New";
    ctx.fillText("SHORELINE → BOSS", barX, 40);
    // Marker
    ctx.fillStyle = "#ff44aa";
    ctx.fillRect(barX + barW * progress - 2, 15, 4, 16);

    // Boss health bar
    if (game.bossActive && !game.boss.dead) {
      const bh = game.boss;
      const bx = W / 2 - 160, by = 56, bw = 320, bhh = 14;
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(bx - 4, by - 16, bw + 8, 36);
      ctx.fillStyle = "#ff88aa";
      ctx.font = "bold 11px Courier New";
      ctx.textAlign = "center";
      ctx.fillText("☢ CYBER-LOBSTER ☢", W / 2, by - 4);
      ctx.fillStyle = "#300018";
      ctx.fillRect(bx, by, bw, bhh);
      const ratio = bh.hp / bh.maxHp;
      const grd = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      grd.addColorStop(0, "#ff2244");
      grd.addColorStop(0.5, "#ff6688");
      grd.addColorStop(1, "#ffaa00");
      ctx.fillStyle = grd;
      ctx.fillRect(bx, by, bw * ratio, bhh);
      ctx.strokeStyle = "#ff4488";
      ctx.strokeRect(bx, by, bw, bhh);
    }

    // Floating message
    if (game.messageT > 0) {
      ctx.globalAlpha = clamp(game.messageT / 30, 0, 1);
      ctx.fillStyle = "#00ffc8";
      ctx.font = "bold 16px Courier New";
      ctx.textAlign = "center";
      ctx.fillText(game.message, W / 2, 100);
      ctx.globalAlpha = 1;
    }
  }

  function drawScanlines() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.07)";
    for (let y = 0; y < H; y += 3) {
      ctx.fillRect(0, y, W, 1);
    }
    // Vignette
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,0,0.35)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  // ---------------------------------------------------------------------------
  // Screens: Start / Win / Game Over
  // ---------------------------------------------------------------------------
  function drawStartScreen() {
    // Animated bg
    drawBackground(game.time * 0.8, game.time);

    // Decorative grid
    ctx.strokeStyle = "rgba(0, 255, 200, 0.08)";
    for (let x = 0; x < W; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // Title panel
    ctx.fillStyle = "rgba(10, 5, 30, 0.8)";
    ctx.fillRect(W / 2 - 300, 60, 600, 420);
    ctx.strokeStyle = "#00ffc8";
    ctx.lineWidth = 2;
    ctx.strokeRect(W / 2 - 300, 60, 600, 420);
    ctx.strokeStyle = "#ff44aa";
    ctx.strokeRect(W / 2 - 294, 66, 588, 408);

    // Title
    ctx.textAlign = "center";
    ctx.fillStyle = "#00ffc8";
    ctx.font = "bold 48px Courier New";
    ctx.shadowColor = "#00ffc8";
    ctx.shadowBlur = 20;
    ctx.fillText("GROK-4.5", W / 2, 130);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ff88cc";
    ctx.font = "bold 20px Courier New";
    ctx.fillText("HERMES AGENT: DIGITAL SHORELINE", W / 2, 165);

    // Mini Hermes preview
    ctx.save();
    const px = W / 2, py = 230;
    // cape
    ctx.fillStyle = "#5b2d9e";
    ctx.beginPath();
    ctx.moveTo(px - 4, py);
    ctx.quadraticCurveTo(px - 28, py + 20, px - 18, py + 45);
    ctx.lineTo(px + 4, py + 30);
    ctx.fill();
    ctx.fillStyle = "#2a1a40";
    ctx.fillRect(px - 14, py - 5, 28, 35);
    ctx.fillStyle = "#00ffc8";
    ctx.fillRect(px - 10, py + 12, 20, 4);
    ctx.fillStyle = "#1a0f30";
    ctx.beginPath();
    ctx.ellipse(px, py - 8, 16, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#0d0818";
    ctx.beginPath();
    ctx.ellipse(px + 2, py - 6, 10, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowColor = "#00ffc8";
    ctx.shadowBlur = 12;
    ctx.fillStyle = "#00ffc8";
    ctx.fillRect(px - 6, py - 10, 5, 5);
    ctx.fillRect(px + 4, py - 10, 5, 5);
    ctx.shadowBlur = 0;
    ctx.restore();

    // Story blurb
    ctx.fillStyle = "#aaccdd";
    ctx.font = "13px Courier New";
    ctx.fillText("A tiny hooded terminal explorer races the chaotic digital shoreline.", W / 2, 300);
    ctx.fillText("Collect tokens. Survive shellfish, rogue terminals & error bubbles.", W / 2, 320);
    ctx.fillText("Defeat the disfigured CYBER-LOBSTER at the end of the world.", W / 2, 340);

    // Controls
    ctx.fillStyle = "#88ffcc";
    ctx.font = "12px Courier New";
    ctx.fillText("←→ / WASD  move    SPACE  jump    J / CLICK  shoot    R  restart", W / 2, 380);

    // Blink prompt
    if (Math.sin(game.time * 0.1) > 0) {
      ctx.fillStyle = "#ffe066";
      ctx.font = "bold 18px Courier New";
      ctx.fillText("▶ PRESS ENTER / SPACE / CLICK TO START", W / 2, 430);
    }

    ctx.fillStyle = "#667788";
    ctx.font = "11px Courier New";
    ctx.fillText("No gore. Pure cartoon chaos. Built for Grok.", W / 2, 460);

    drawScanlines();
  }

  function drawWinScreen() {
    ctx.fillStyle = "rgba(0, 20, 30, 0.75)";
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";
    ctx.shadowColor = "#00ffc8";
    ctx.shadowBlur = 25;
    ctx.fillStyle = "#00ffc8";
    ctx.font = "bold 52px Courier New";
    ctx.fillText("SHORELINE CLEARED!", W / 2, H / 2 - 60);
    ctx.shadowBlur = 0;

    ctx.fillStyle = "#ffe066";
    ctx.font = "22px Courier New";
    ctx.fillText("The cyber-lobster has been debug-defeated.", W / 2, H / 2 - 10);

    ctx.fillStyle = "#e0f7ff";
    ctx.font = "18px Courier New";
    ctx.fillText("FINAL SCORE  " + game.player.score, W / 2, H / 2 + 40);
    ctx.fillStyle = "#ffe066";
    ctx.fillText("TOKENS  " + game.player.tokens, W / 2, H / 2 + 70);

    if (Math.sin(game.time * 0.12) > 0) {
      ctx.fillStyle = "#ff88cc";
      ctx.font = "bold 16px Courier New";
      ctx.fillText("PRESS R TO PLAY AGAIN", W / 2, H / 2 + 120);
    }

    // Confetti particles
    for (let i = 0; i < 20; i++) {
      const x = (Math.sin(game.time * 0.05 + i) * 0.5 + 0.5) * W;
      const y = ((game.time * 2 + i * 50) % (H + 20));
      ctx.fillStyle = ["#00ffc8", "#ff44aa", "#ffe066", "#88aaff"][i % 4];
      ctx.fillRect(x, y, 6, 6);
    }

    drawScanlines();
  }

  function drawOverScreen() {
    ctx.fillStyle = "rgba(30, 0, 20, 0.75)";
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";
    ctx.shadowColor = "#ff4466";
    ctx.shadowBlur = 20;
    ctx.fillStyle = "#ff6688";
    ctx.font = "bold 52px Courier New";
    ctx.fillText("CONNECTION LOST", W / 2, H / 2 - 50);
    ctx.shadowBlur = 0;

    ctx.fillStyle = "#aaccdd";
    ctx.font = "18px Courier New";
    ctx.fillText("Hermes Agent crashed on the digital shoreline.", W / 2, H / 2);
    ctx.fillStyle = "#e0f7ff";
    ctx.fillText("SCORE  " + game.player.score + "   TOKENS  " + game.player.tokens, W / 2, H / 2 + 40);

    if (Math.sin(game.time * 0.12) > 0) {
      ctx.fillStyle = "#00ffc8";
      ctx.font = "bold 16px Courier New";
      ctx.fillText("PRESS R TO REBOOT", W / 2, H / 2 + 100);
    }

    drawScanlines();
  }

  // ---------------------------------------------------------------------------
  // Main render
  // ---------------------------------------------------------------------------
  function render() {
    if (!game) return;

    ctx.save();
    // Screen shake
    if (game.shake > 0.5) {
      ctx.translate(
        (Math.random() - 0.5) * game.shake,
        (Math.random() - 0.5) * game.shake
      );
    }

    if (game.state === STATE.START) {
      drawStartScreen();
      ctx.restore();
      return;
    }

    const camX = game.camX;
    drawBackground(camX, game.time);
    drawDecorations(camX);
    drawPlatforms(camX);
    drawCheckpoints(camX);
    drawTokens(camX);
    drawEnemies(camX);
    drawBossBubbles(camX);
    drawBoss(camX);
    drawBolts(camX);
    drawPlayer(camX);
    drawParticles(camX);
    drawFloats(camX);

    // Water foam line near beach ground (subtle)
    if (zoneAt(camX + W / 2) === "beach") {
      ctx.fillStyle = "rgba(180, 230, 255, 0.15)";
      for (let x = 0; x < W; x += 8) {
        const y = GROUND_Y - 2 + Math.sin((x + camX) * 0.05 + game.time * 0.08) * 3;
        ctx.fillRect(x, y, 6, 3);
      }
    }

    drawHUD();
    drawScanlines();

    if (game.state === STATE.WIN) drawWinScreen();
    if (game.state === STATE.OVER) drawOverScreen();

    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Game loop
  // ---------------------------------------------------------------------------
  let last = performance.now();

  function loop(now) {
    const dt = Math.min(now - last, 50); // cap delta
    last = now;

    // Title screen idle anim
    if (game && game.state === STATE.START) {
      game.time++;
    }

    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  // Boot
  initTitle();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
