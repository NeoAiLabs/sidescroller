<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HERMES AGENT vs. The Disfigured Cyber-Lobster</title>
<style>
  /* ---------- Page layout: centre the canvas on a dark retro backdrop ---------- */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 40%, #24104a 0%, #0b0418 60%, #030108 100%);
    font-family: "Courier New", Courier, monospace;
  }
  #wrap {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 0 2px rgba(44,245,255,0.45), 0 0 30px rgba(255,63,216,0.35), 0 0 90px rgba(44,245,255,0.18);
  }
  canvas { display: block; cursor: crosshair; }
  /* CRT scanline overlay (pure CSS, no assets) */
  #wrap::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background: repeating-linear-gradient(to bottom,
      rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px,
      rgba(0,0,0,0.13) 2px, rgba(0,0,0,0.13) 3px);
  }
  /* Soft CRT vignette */
  #wrap::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(0,0,0,0.45) 100%);
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
(() => {
'use strict';

/* =========================================================================
   1. CONSTANTS & CONFIG
   ========================================================================= */
const VIEW_W = 960, VIEW_H = 540;        // logical resolution (scaled to fit the window)
const GROUND_Y = 460;                    // y of the main floor surface
const GRAVITY = 2000;                    // px / s^2
const JUMP_V = 800;                      // initial jump velocity (~160px jump height)
const MOVE_SPEED = 270;                  // max run speed
const FIXED_DT = 1 / 120;                // fixed physics step for stable collisions
const ARENA_X0 = 9000, ARENA_X1 = 9960;  // boss arena bounds (exactly one screen wide)
const BOSS_HP = 36;
const PLAYER_MAX_HP = 5;
const START_LIVES = 3;
const FONT = '"Courier New", Courier, monospace';
const BEST_KEY = 'hermesAgentShorelineBest';

// World zones: each has a name, start x, accent colour and a 3-stop sky palette
const ZONES = [
  { name: 'ZONE 1 // GLITCH BEACH',       start: -1e9, color: '#ffd23f', sky: ['#2b1055', '#c9378f', '#ff9a5a'] },
  { name: 'ZONE 2 // SERVER SHALLOWS',    start: 3200, color: '#2cf5ff', sky: ['#020b1a', '#07314d', '#0f6a78'] },
  { name: 'ZONE 3 // NEON TERMINAL REEF', start: 6400, color: '#c77dff', sky: ['#07000f', '#2a0845', '#5a1070'] },
  { name: 'ZONE 4 // THE LOBSTER DEN',    start: 8900, color: '#ff3355', sky: ['#12000a', '#4a0620', '#a0103a'] },
];

/* =========================================================================
   2. SMALL UTILITIES
   ========================================================================= */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
// Deterministic pseudo-random in [0,1) - used for stable procedural backgrounds
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
// Axis-aligned rectangle overlap
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
// Circle vs rectangle overlap
function circleRect(cx, cy, r, b) {
  const nx = clamp(cx, b.x, b.x + b.w), ny = clamp(cy, b.y, b.y + b.h);
  return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
}
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
// Weighted mix of several hex colours -> css rgb()
function mixHex(pairs) {
  let r = 0, g = 0, b = 0, tw = 0;
  for (const [hex, w] of pairs) { if (w <= 0) continue; const c = hexToRgb(hex); r += c[0] * w; g += c[1] * w; b += c[2] * w; tw += w; }
  tw = tw || 1;
  return `rgb(${(r / tw) | 0},${(g / tw) | 0},${(b / tw) | 0})`;
}
function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function zoneIndexAt(x) { let z = 0; for (let i = 0; i < ZONES.length; i++) if (x >= ZONES[i].start) z = i; return z; }
// Blend weights for backgrounds: cross-fade over 300px before each zone boundary
function zoneWeights(x) {
  const w = [0, 0, 0, 0];
  const zi = zoneIndexAt(x), B = 300;
  if (zi < ZONES.length - 1 && x > ZONES[zi + 1].start - B) {
    const t = (x - (ZONES[zi + 1].start - B)) / B;
    w[zi] = 1 - t; w[zi + 1] = t;
  } else w[zi] = 1;
  return w;
}
function loadBest() { try { return parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) { /* file:// may block storage */ } }

/* =========================================================================
   3. CANVAS SETUP (responsive + crisp on HiDPI)
   ========================================================================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
// Off-screen canvases used to render the boss so we can apply glitch slicing / RGB split
const BC_W = 460, BC_H = 340, BC_OX = 230, BC_OY = 320; // size and origin (boss feet) of boss canvas
const bossCanvas = document.createElement('canvas'); const bctx = bossCanvas.getContext('2d');
const tintCanvas = document.createElement('canvas'); const tctx = tintCanvas.getContext('2d');
let RS = 1;   // render scale (logical px -> device px)
let BS = 1;   // boss canvas scale
function resize() {
  const s = Math.max(0.3, Math.min(window.innerWidth / VIEW_W, window.innerHeight / VIEW_H));
  const dpr = window.devicePixelRatio || 1;
  const cssW = Math.floor(VIEW_W * s), cssH = Math.floor(VIEW_H * s);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  RS = canvas.width / VIEW_W;
  BS = Math.min(2, RS);
  bossCanvas.width = tintCanvas.width = Math.ceil(BC_W * BS);
  bossCanvas.height = tintCanvas.height = Math.ceil(BC_H * BS);
}
window.addEventListener('resize', resize);
resize();

/* =========================================================================
   4. AUDIO - tiny WebAudio synth (no audio files) + chiptune loop
   ========================================================================= */
const Sound = {
  ctx: null, master: null, muted: false, noiseBuf: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.35;
    this.master.connect(this.ctx.destination);
    const len = (this.ctx.sampleRate * 0.5) | 0;
    this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  },
  // Play an oscillator tone. delay is relative seconds from now.
  tone(freq, dur, type = 'square', vol = 0.1, slideTo = 0, delay = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + Math.max(0, delay);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo > 0) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  // Filtered noise burst (drums, explosions)
  noise(dur, vol = 0.1, delay = 0, freq = 1200) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + Math.max(0, delay);
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.02);
  },
};
// Sound effect library
const SFX = {
  jump:   () => Sound.tone(320, 0.12, 'square', 0.07, 660),
  shoot:  () => Sound.tone(1000, 0.07, 'square', 0.04, 380),
  token:  () => { Sound.tone(1320, 0.06, 'triangle', 0.09); Sound.tone(1980, 0.1, 'triangle', 0.09, 0, 0.06); },
  stomp:  () => { Sound.tone(240, 0.1, 'square', 0.09, 90); Sound.noise(0.08, 0.08, 0, 900); },
  hit:    () => Sound.tone(460, 0.05, 'square', 0.05, 220),
  kill:   () => { Sound.noise(0.18, 0.12, 0, 2400); Sound.tone(700, 0.16, 'square', 0.06, 110); },
  pop:    () => Sound.tone(900, 0.07, 'sine', 0.08, 1700),
  hurt:   () => { Sound.tone(280, 0.3, 'sawtooth', 0.11, 70); Sound.noise(0.1, 0.06, 0, 1500); },
  die:    () => { Sound.tone(520, 0.7, 'sawtooth', 0.11, 40); Sound.noise(0.4, 0.08, 0.1, 800); },
  check:  () => [660, 880, 1320].forEach((f, i) => Sound.tone(f, 0.12, 'square', 0.06, 0, i * 0.08)),
  patch:  () => [520, 780, 1040, 1560].forEach((f, i) => Sound.tone(f, 0.1, 'triangle', 0.08, 0, i * 0.06)),
  bossHit:() => { Sound.tone(170, 0.08, 'square', 0.08, 80); Sound.noise(0.05, 0.05, 0, 3000); },
  slam:   () => { Sound.noise(0.45, 0.25, 0, 380); Sound.tone(90, 0.4, 'sine', 0.25, 35); },
  alarm:  () => { for (let i = 0; i < 4; i++) { Sound.tone(880, 0.18, 'square', 0.05, 0, i * 0.36); Sound.tone(620, 0.18, 'square', 0.05, 0, i * 0.36 + 0.18); } },
  roar:   () => { Sound.tone(140, 0.9, 'sawtooth', 0.12, 45); Sound.tone(147, 0.9, 'square', 0.05, 50); Sound.noise(0.8, 0.1, 0, 600); },
  bubble: () => Sound.tone(600, 0.1, 'sine', 0.04, 1100),
  boom:   () => { Sound.noise(0.3, 0.14, 0, 1200); Sound.tone(200, 0.25, 'square', 0.05, 50); },
  win:    () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => Sound.tone(f, 0.18, 'square', 0.07, 0, i * 0.13)),
  over:   () => [440, 370, 311, 220].forEach((f, i) => Sound.tone(f, 0.3, 'sawtooth', 0.07, 0, i * 0.22)),
};
// Tiny step sequencer: bass + arpeggio + hats, changes per zone and for the boss
const Music = {
  next: 0, step: 0,
  update() {
    if (!Sound.ctx || Sound.muted || game.state !== 'play') { if (Sound.ctx) this.next = 0; return; }
    const now = Sound.ctx.currentTime;
    const boss = game.bossActive;
    const tempo = boss ? 0.115 : 0.14;
    if (this.next < now) this.next = now + 0.05;
    while (this.next < now + 0.2) {
      this.playStep(this.step, this.next - now, boss);
      this.next += tempo;
      this.step = (this.step + 1) % 64;
    }
  },
  playStep(s, d, boss) {
    const zi = boss ? 3 : zoneIndexAt(player.x);
    const progs = [[45, 41, 48, 43], [38, 41, 36, 43], [40, 43, 36, 38], [40, 40, 41, 39]];
    const root = progs[zi][(s / 16) | 0];
    const b = s % 16;
    const nf = (n) => 440 * Math.pow(2, (n - 69) / 12);
    if ([0, 3, 6, 8, 10, 12, 14].includes(b)) Sound.tone(nf(root), 0.13, boss ? 'sawtooth' : 'triangle', boss ? 0.05 : 0.08, 0, d);
    if (b % 2 === 0) { const arp = [0, 7, 12, 19, 24, 19, 12, 7]; Sound.tone(nf(root + 24 + arp[(b / 2) % 8]), 0.08, 'square', 0.018, 0, d); }
    if (b % 4 === 2) Sound.noise(0.03, 0.03, d, 7000);
    if (b % 8 === 0) Sound.noise(0.09, 0.07, d, 250);
  },
};

/* =========================================================================
   5. INPUT (keyboard + mouse)
   ========================================================================= */
const keys = {};
let mouseDown = false;
let jumpBuffer = 0;                      // lets a jump press register slightly before landing
const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW'];
const inp = {
  get left()  { return !!(keys.ArrowLeft || keys.KeyA); },
  get right() { return !!(keys.ArrowRight || keys.KeyD); },
  get down()  { return !!(keys.ArrowDown || keys.KeyS); },
  get jump()  { return !!(keys.Space || keys.ArrowUp || keys.KeyW); },
  get shoot() { return !!(keys.KeyJ || mouseDown); },
};
window.addEventListener('keydown', (e) => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  Sound.init();
  const first = !keys[e.code];
  keys[e.code] = true;
  if (first) onPress(e.code);
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  mouseDown = false;
  if (game.state === 'play') game.state = 'paused';
});
canvas.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  Sound.init();
  if (game.state === 'start') startGame();
  else if (game.state === 'play') mouseDown = true;
  else if (game.state === 'paused') game.state = 'play';
});
window.addEventListener('mouseup', (e) => { if (e.button === 0) mouseDown = false; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// Edge-triggered key presses (menus, jump buffering, pause)
function onPress(code) {
  if (code === 'KeyM') { Sound.muted = !Sound.muted; return; }
  switch (game.state) {
    case 'start':
      if (code === 'Enter' || code === 'Space') startGame();
      break;
    case 'play':
      if (JUMP_KEYS.includes(code)) jumpBuffer = 0.14;
      if (code === 'KeyP' || code === 'Escape') game.state = 'paused';
      break;
    case 'paused':
      if (code === 'KeyP' || code === 'Escape' || code === 'Enter') game.state = 'play';
      if (code === 'KeyR') startGame();
      break;
    case 'win':
    case 'gameover':
      if ((code === 'KeyR' || code === 'Enter') && game.screenTime > 0.6) startGame();
      break;
  }
}

/* =========================================================================
   6. LEVEL DATA
   ========================================================================= */
// Ground segments [startX, endX] - gaps between them are deadly "data sea" pits
const GROUND_SEGS = [[-400, 1200], [1340, 2020], [2170, 4000], [4180, 5080], [5250, 6000], [6160, 7000], [7220, 8050], [8200, 10300]];
// Solid raised blocks [x, y, w, h] (dunes, server racks, neon cubes)
const BLOCKS = [
  [720, 410, 100, 50], [1560, 400, 80, 60], [2480, 400, 120, 60], [2600, 350, 80, 110], [2960, 410, 80, 50],
  [3480, 380, 70, 80], [3760, 340, 70, 120], [4500, 390, 90, 70], [4860, 360, 70, 100], [5500, 380, 80, 80], [5800, 400, 120, 60],
  [6600, 380, 100, 80], [6850, 400, 80, 60], [7500, 370, 120, 90], [7850, 400, 80, 60], [8450, 390, 100, 70],
];
// One-way floating platforms [x, y, w] (jump through from below, S/Down to drop)
const FLOATS = [
  [380, 350, 130], [560, 280, 110], [1000, 340, 120], [1210, 320, 110], [1750, 330, 130], [1900, 260, 110],
  [2040, 340, 110], [2300, 320, 120], [2780, 270, 130],
  [3300, 340, 120], [3620, 260, 120], [3960, 350, 100], [4090, 290, 110], [4300, 330, 120], [4660, 290, 120],
  [5040, 340, 110], [5180, 280, 100], [5380, 320, 130], [5650, 260, 120], [5980, 340, 120], [6200, 300, 120],
  [6450, 330, 120], [6750, 270, 110], [6980, 340, 100], [7110, 290, 110], [7300, 330, 120], [7650, 280, 120],
  [8010, 340, 110], [8300, 320, 120], [8650, 300, 130],
  [9130, 320, 150], [9680, 320, 150], // boss arena perches
];
const CHECKPOINTS = [2280, 4250, 6250, 8780];
// Enemies: [x, optionalTopY]
const SHELLS = [[650], [1050], [1500], [1850], [2400], [2850], [3350], [3650], [4400], [4750], [5400], [5700], [5840, 400], [6350], [6760], [7400], [7700], [8350], [8650]];
const TERMS = [[1100], [2620, 350], [3900], [4950], [6420], [7540, 370], [8900]];
const BUBBLES = [[1270, 260], [1950, 200], [2750, 200], [3150, 250], [4090, 210], [4600, 230], [5150, 210], [5900, 230], [6600, 220], [7050, 230], [7400, 240], [8100, 230], [8500, 230]];
const PATCHES = [[3000, 385], [5710, 225], [7710, 245], [8715, 265]];
// Token layouts built from helper lines and arcs
function buildTokens() {
  const list = [];
  const line = (x, y, n, sp = 36) => { for (let i = 0; i < n; i++) list.push({ x: x + i * sp, y, taken: false }); };
  const arc = (x, y, n, sp, h) => { for (let i = 0; i < n; i++) list.push({ x: x + i * sp, y: y - Math.sin(Math.PI * i / (n - 1)) * h, taken: false }); };
  line(200, 430, 4); line(400, 320, 3); line(580, 250, 3); arc(1170, 420, 5, 45, 110); line(1400, 430, 3);
  line(1770, 300, 3); line(1915, 230, 3); arc(2000, 420, 5, 45, 100); line(2300, 290, 3); line(2500, 370, 3);
  line(2620, 320, 2); line(2800, 240, 3); line(3080, 430, 4);
  line(3310, 310, 3); line(3635, 230, 3); arc(3960, 320, 6, 45, 110); line(4310, 300, 3); line(4520, 360, 2);
  line(4670, 260, 3); line(4880, 330, 2); arc(5040, 420, 5, 48, 120); line(5390, 290, 3); line(5660, 230, 3);
  line(5820, 370, 3); arc(5970, 420, 5, 45, 110); line(6210, 270, 3);
  line(6460, 300, 3); line(6620, 350, 2); line(6760, 240, 3); arc(6980, 310, 6, 45, 90); line(7310, 300, 3);
  line(7520, 340, 3); line(7660, 250, 3); line(7860, 370, 2); arc(8010, 420, 5, 45, 110); line(8310, 290, 3);
  line(8460, 360, 2); line(8660, 270, 3); line(8830, 430, 3);
  return list;
}

/* =========================================================================
   7. GAME STATE
   ========================================================================= */
const game = {
  state: 'start',     // start | play | paused | win | gameover
  time: 0, screenTime: 0, runTime: 0,
  score: 0, tokens: 0, totalTokens: 0, lives: START_LIVES,
  bossActive: false, winTimer: -1,
  shake: 0, flash: 0, flashColor: '#fff',
  banner: null, zone: -1, best: loadBest(), newBest: false,
};
let player, enemies, tokens, patches, checkpoints, bolts, eBullets, bossBubbles, shockwaves;
let particles = [], texts = [], confetti = [];
let solids = [], floats = [], barrier = null, boss, respawn;
const camera = { x: 0 };

/* =========================================================================
   8. ENTITY FACTORIES
   ========================================================================= */
function createPlayer(x) {
  return {
    x, y: GROUND_Y - 38, w: 24, h: 38, vx: 0, vy: 0, prevY: 0, facing: 1,
    onGround: false, coyote: 0, hp: PLAYER_MAX_HP, invuln: 0, stun: 0,
    shootCd: 0, muzzle: 0, anim: 0, dropTimer: 0, dead: false, deadTimer: 0,
  };
}
function createBoss() {
  return {
    state: 'dormant', cx: ARENA_X1 - 230, by: -250, vx: 0, vy: 0, hp: BOSS_HP, facing: -1,
    timer: 0, anim: 0, flash: 0, glitch: 0, phase: 1, onGround: false, spawnT: 0, bubbleCount: 0,
    last: '', stompCd: 0, didDouble: false, chargeDir: -1, boomT: 0, walkT: 0,
  };
}
let uid = 0;
function buildWorld() {
  // Solid rectangles: ground, blocks, world walls
  solids = GROUND_SEGS.map(([a, b]) => ({ x: a, y: GROUND_Y, w: b - a, h: 200, kind: 'ground' }));
  BLOCKS.forEach(([x, y, w, h]) => solids.push({ x, y, w, h, kind: 'block' }));
  solids.push({ x: -60, y: -2000, w: 60, h: 3000, kind: 'wall' });
  solids.push({ x: ARENA_X1, y: -2000, w: 300, h: 3000, kind: 'wall' });
  floats = FLOATS.map(([x, y, w]) => ({ x, y, w, h: 14 }));
  barrier = null;

  enemies = [];
  SHELLS.forEach(([x, y]) => enemies.push({ id: uid++, type: 'shell', x, y: (y || GROUND_Y) - 26, w: 38, h: 26, vx: Math.random() < 0.5 ? -70 : 70, vy: 0, hp: 2, flash: 0, anim: rand(0, 5), alive: true, score: 100 }));
  TERMS.forEach(([x, y]) => enemies.push({ id: uid++, type: 'term', x, y: (y || GROUND_Y) - 40, w: 40, h: 40, vx: 0, vy: 0, hp: 3, flash: 0, anim: rand(0, 5), alive: true, hop: rand(0.8, 2.2), shoot: rand(1.5, 2.8), facing: -1, score: 150 }));
  BUBBLES.forEach(([x, y]) => enemies.push({ id: uid++, type: 'bubble', hx: x, hy: y, cx: x, cy: y, r: 16, x: x - 16, y: y - 16, w: 32, h: 32, hp: 1, flash: 0, anim: rand(0, 6), t: rand(0, 6), alive: true, score: 50 }));

  tokens = buildTokens();
  game.totalTokens = tokens.length;
  patches = PATCHES.map(([x, y]) => ({ x, y, taken: false }));
  checkpoints = CHECKPOINTS.map((x) => ({ x, active: false, t: 0 }));
}

/* =========================================================================
   9. GAME FLOW
   ========================================================================= */
function startGame() {
  Sound.init();
  buildWorld();
  player = createPlayer(80);
  boss = createBoss();
  bolts = []; eBullets = []; bossBubbles = []; shockwaves = [];
  particles = []; texts = []; confetti = [];
  respawn = { x: 80 };

    winTimer: -1, shake: 0, flash: 0, banner: null, zone: -1, screenTime: 0, newBest: false });

}
function showBanner(text, color, dur = 2.6, sub = '') { game.banner = { text, color, sub, t: dur, max: dur }; }
function addScore(n) { game.score += n; }
function addText(x, y, text, color = '#fff', size = 14) { texts.push({ x, y, text, color, size, life: 1, max: 1 }); }
function doFlash(color, amt) { game.flash = Math.max(game.flash, amt); game.flashColor = color; }

/* =========================================================================
   10. PARTICLES
   ========================================================================= */
function burst(x, y, n, colors, speed = 220, life = 0.6, size = 4, grav = 700) {
  for (let i = 0; i < n; i++) {
    if (particles.length > 700) particles.shift();
    const a = Math.random() * Math.PI * 2, s = speed * (0.3 + Math.random() * 0.7);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - speed * 0.3, life: life * rand(0.6, 1.2), max: life,
      color: pick(colors), size: size * rand(0.6, 1.3), grav });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i]; t.y -= 45 * dt; t.life -= dt;
    if (t.life <= 0) texts.splice(i, 1);
  }
  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i];
    c.vy += 120 * dt; c.x += c.vx * dt + Math.sin(c.t * 4) * 20 * dt; c.y += c.vy * dt; c.t += dt; c.rot += c.vr * dt;
    if (c.y > VIEW_H + 20) confetti.splice(i, 1);
  }
}

/* =========================================================================
   11. PHYSICS & COLLISION
   ========================================================================= */
// Is a point inside any solid (optionally include one-way platforms)?
function isSolidAt(px, py, includeFloats = true) {
  for (const s of solids) if (px >= s.x && px <= s.x + s.w && py >= s.y && py <= s.y + s.h) return true;
  if (includeFloats) for (const f of floats) if (px >= f.x && px <= f.x + f.w && py >= f.y && py <= f.y + f.h) return true;
  return false;
}
// Move an entity by its velocity, resolving X then Y against solids + one-way floats
function moveEntity(e, dt) {
  e.hitWall = false;
  e.x += e.vx * dt;
  for (const s of solids) {
    if (overlap(e, s)) {
      if (e.vx > 0) e.x = s.x - e.w; else if (e.vx < 0) e.x = s.x + s.w;
      e.hitWall = true;
    }
  }
  const prevBottom = e.y + e.h;
  e.y += e.vy * dt;
  e.onGround = false;
  for (const s of solids) {
    if (overlap(e, s)) {
      if (e.vy > 0) { e.y = s.y - e.h; e.onGround = true; } else if (e.vy < 0) e.y = s.y + s.h;
      e.vy = 0;
    }
  }
  if (e.vy >= 0 && !(e.dropTimer > 0)) {
    for (const f of floats) {
      if (e.x + e.w > f.x && e.x < f.x + f.w && prevBottom <= f.y + 0.5 && e.y + e.h >= f.y) {
        e.y = f.y - e.h; e.vy = 0; e.onGround = true;
      }
    }
  }
}
function onFloat(e) {
  const b = e.y + e.h;
  return floats.some((f) => Math.abs(b - f.y) < 1 && e.x + e.w > f.x && e.x < f.x + f.w);
}

/* =========================================================================
   12. PLAYER
   ========================================================================= */
function updatePlayer(dt) {
  const p = player;
  if (p.dead) {
    p.deadTimer -= dt;
    if (p.deadTimer <= 0) {
      if (game.lives <= 0) endGame(false);
      else respawnPlayer(true);
    }
    return;
  }
  p.prevY = p.y;
  p.invuln = Math.max(0, p.invuln - dt);
  p.stun = Math.max(0, p.stun - dt);
  p.shootCd -= dt;
  p.muzzle = Math.max(0, p.muzzle - dt);
  p.dropTimer = Math.max(0, p.dropTimer - dt);

  // --- Horizontal movement with acceleration & friction ---
  let move = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  if (p.stun > 0) move = 0;
  const accel = p.onGround ? 2600 : 1600;
  if (move) {
    p.facing = move;
    if (Math.abs(p.vx) > MOVE_SPEED && Math.sign(p.vx) === move) p.vx -= Math.sign(p.vx) * 900 * dt;
    else p.vx = clamp(p.vx + move * accel * dt, -MOVE_SPEED, MOVE_SPEED);
  } else {
    const fr = (p.onGround ? 2400 : 500) * dt;
    p.vx = Math.abs(p.vx) <= fr ? 0 : p.vx - Math.sign(p.vx) * fr;
  }

  // --- Jumping (coyote time + jump buffer + variable height) ---
  p.coyote = p.onGround ? 0.1 : p.coyote - dt;
  if (jumpBuffer > 0 && inp.down && p.onGround && onFloat(p)) {
    p.dropTimer = 0.22; jumpBuffer = 0; p.y += 2;              // drop through platform
  } else if (jumpBuffer > 0 && p.coyote > 0) {
    p.vy = -JUMP_V; p.coyote = 0; jumpBuffer = 0; p.onGround = false;
    SFX.jump();
    burst(p.x + p.w / 2, p.y + p.h, 6, ['#fff', '#ffe29a', '#2cf5ff'], 90, 0.35, 3, 200);
  }
  if (inp.down && p.onGround && onFloat(p) && p.dropTimer <= 0 && !inp.jump) { p.dropTimer = 0.22; p.y += 2; }

  let g = GRAVITY;
  if (p.vy < 0 && !inp.jump) g *= 2.3;                          // short hop when jump released
  p.vy = Math.min(p.vy + g * dt, 1100);

  const wasGround = p.onGround;
  moveEntity(p, dt);
  if (p.hitWall) p.vx = 0;
  if (!wasGround && p.onGround && p.prevY + p.h < p.y + p.h - 0.5) {
    burst(p.x + p.w / 2, p.y + p.h, 4, ['#ffffffaa', '#cfc6ff'], 60, 0.3, 3, 100);
  }
  p.anim += dt;

  // --- Shooting prompt bolts ---
  if (inp.shoot && p.shootCd <= 0) {
    bolts.push({ x: p.x + p.w / 2 + p.facing * 14, y: p.y + 19, vx: p.facing * 660, life: 0.85, trail: [] });
    p.shootCd = 0.2; p.muzzle = 0.08;
    SFX.shoot();
  }

  // --- Fell into the data sea ---
  if (p.y > VIEW_H + 60) {
    p.hp -= 1;
    SFX.hurt(); doFlash('#ff2d6f', 0.4); game.shake = 10;
    if (p.hp <= 0) killPlayer();
    else { respawnPlayer(false); addText(p.x + p.w / 2, p.y - 10, 'SEGFAULT -1', '#ff4d6d', 16); }
    return;
  }

  // --- Pickups ---
  const pb = { x: p.x - 4, y: p.y - 4, w: p.w + 8, h: p.h + 8 };
  for (const t of tokens) {
    if (t.taken || Math.abs(t.x - p.x) > 60) continue;
    if (circleRect(t.x, t.y, 12, pb)) {
      t.taken = true; game.tokens++; addScore(10); SFX.token();
      burst(t.x, t.y, 8, ['#ffe66d', '#fff', '#ff9f1c'], 140, 0.4, 3, 100);
      addText(t.x, t.y - 10, '+10', '#ffe66d', 12);
    }
  }
  for (const h of patches) {
    if (h.taken) continue;
    if (circleRect(h.x, h.y, 14, pb)) {
      h.taken = true; p.hp = Math.min(PLAYER_MAX_HP, p.hp + 2); SFX.patch();
      burst(h.x, h.y, 16, ['#39ff88', '#fff', '#2cf5ff'], 180, 0.6, 4, 150);
      addText(h.x, h.y - 16, 'PATCH INSTALLED +2', '#39ff88', 14);
    }
  }
  // --- Checkpoints: activate when passed ---
  const pcx = p.x + p.w / 2;
  for (const c of checkpoints) {
    if (!c.active && pcx > c.x - 10) {
      c.active = true; respawn = { x: c.x - 12 };
      p.hp = PLAYER_MAX_HP; addScore(200); SFX.check();
      burst(c.x, GROUND_Y - 70, 24, ['#39ff88', '#2cf5ff', '#fff'], 220, 0.8, 4, 200);
      addText(c.x, GROUND_Y - 100, 'CHECKPOINT SAVED // HP RESTORED', '#39ff88', 14);
    }
  }
}
function hurtPlayer(dmg, srcX) {
  const p = player;
  if (p.invuln > 0 || p.dead || game.state !== 'play') return;
  p.hp -= dmg;
  p.invuln = 1.3; p.stun = 0.25;
  p.vx = (p.x + p.w / 2 < srcX ? -1 : 1) * 330; p.vy = -420; p.onGround = false;
  game.shake = Math.max(game.shake, 9); doFlash('#ff2d6f', 0.3);
  SFX.hurt();
  burst(p.x + p.w / 2, p.y + p.h / 2, 12, ['#ff4d6d', '#fff', '#ff3fd8'], 200, 0.5, 3, 400);
  addText(p.x + p.w / 2, p.y - 8, '-' + dmg + ' HP', '#ff4d6d', 14);
  if (p.hp <= 0) killPlayer();
}
function killPlayer() {
  const p = player;
  p.hp = 0; p.dead = true; p.deadTimer = 1.6; game.lives--;
  SFX.die(); game.shake = 14; doFlash('#ffffff', 0.5);
  // Hermes "derezzes" into glowing pixels (no gore)
  burst(p.x + p.w / 2, Math.min(p.y + p.h / 2, VIEW_H - 20), 40, ['#6a4cff', '#2cf5ff', '#ff3fd8', '#ffd23f', '#fff'], 300, 1.1, 5, 300);
  addText(p.x + p.w / 2, Math.min(p.y, VIEW_H - 60), game.lives > 0 ? 'PROCESS KILLED - REBOOTING' : 'FATAL ERROR', '#ff4d6d', 16);
}
function respawnPlayer(full) {
  const p = player;
  p.x = respawn.x; p.y = GROUND_Y - p.h - 2; p.vx = 0; p.vy = 0;
  p.dead = false; p.invuln = 1.6; p.stun = 0;
  if (full) p.hp = PLAYER_MAX_HP;
  if (boss.state !== 'dormant') resetBoss();
  camera.x = clamp(p.x - VIEW_W / 2 + 70, 0, ARENA_X0);
  burst(p.x + p.w / 2, p.y + p.h / 2, 20, ['#2cf5ff', '#fff', '#6a4cff'], 160, 0.6, 3, 0);
}

/* =========================================================================
   13. ENEMIES
   ========================================================================= */
function damageEnemy(e, dmg) {
  e.hp -= dmg; e.flash = 0.12;
  if (e.hp <= 0) {
    e.alive = false; addScore(e.score);
    const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
    const cols = e.type === 'shell' ? ['#2ee6c9', '#ff5e7e', '#ffd23f', '#fff'] : e.type === 'term' ? ['#c9c1e8', '#39ff88', '#ff4d6d', '#fff'] : ['#9ffcff', '#ff3fd8', '#fff'];
    burst(cx, cy, 22, cols, 260, 0.7, 4, 500);
    addText(cx, e.y - 6, '+' + e.score, '#ffd23f', 14);
    e.type === 'bubble' ? SFX.pop() : SFX.kill();
    game.shake = Math.max(game.shake, 4);
  } else {
    SFX.hit();
    burst(e.x + e.w / 2, e.y + e.h / 2, 5, ['#fff', '#2cf5ff'], 140, 0.3, 3, 300);
  }
}
function updateEnemies(dt) {
  const p = player;
  const pcx = p.x + p.w / 2, pcy = p.y + p.h / 2;
  for (const e of enemies) {
    if (!e.alive) continue;
    if (Math.abs(e.x - (camera.x + VIEW_W / 2)) > 1000) continue;   // sleep when far away
    e.anim += dt; e.flash = Math.max(0, e.flash - dt);

    if (e.type === 'shell') {
      // Corrupted shellfish: patrols, turns at walls and ledges
      e.vy = Math.min(e.vy + GRAVITY * dt, 1000);
      moveEntity(e, dt);
      if (e.hitWall) e.vx = -e.vx;
      else if (e.onGround) {
        const fx = e.vx > 0 ? e.x + e.w + 3 : e.x - 3;
        if (!isSolidAt(fx, e.y + e.h + 6)) e.vx = -e.vx;
      }
      if (e.y > VIEW_H + 100) e.alive = false;
    } else if (e.type === 'term') {
      // Rogue terminal: hops in place and fires error packets at the player
      e.facing = pcx < e.x + e.w / 2 ? -1 : 1;
      e.vx = 0;
      e.vy = Math.min(e.vy + GRAVITY * dt, 1000);
      moveEntity(e, dt);
      if (e.onGround) { e.hop -= dt; if (e.hop <= 0) { e.vy = -430; e.hop = rand(1.4, 2.6); } }
      const dx = pcx - (e.x + e.w / 2), dy = pcy - (e.y + e.h / 2);
      e.charging = false;
      if (Math.abs(dx) < 480 && Math.abs(dy) < 180 && !p.dead) {
        e.shoot -= dt;
        e.charging = e.shoot < 0.4;
        if (e.shoot <= 0) {
          const d = Math.hypot(dx, dy) || 1;
          eBullets.push({ x: e.x + e.w / 2 + e.facing * 16, y: e.y + 18, vx: dx / d * 250, vy: dy / d * 250, r: 7, life: 3.2, rot: 0 });
          e.shoot = rand(1.8, 2.8);
          Sound.tone(300, 0.1, 'square', 0.04, 600);
        }
      }
    } else if (e.type === 'bubble') {
      // Floating error bubble: bobs around, drifts toward the player when close
      e.t += dt;
      const dx = pcx - e.hx, dy = pcy - e.hy, d = Math.hypot(dx, dy);
      if (d < 360 && d > 1 && !p.dead) { e.hx += dx / d * 55 * dt; e.hy += dy / d * 55 * dt; }
      e.cx = e.hx + Math.sin(e.t * 1.3) * 14;
      e.cy = e.hy + Math.sin(e.t * 2.1) * 16;
      e.x = e.cx - e.r; e.y = e.cy - e.r;
    }

    // Contact with player: stomp from above, otherwise take damage
    if (!p.dead && e.alive && overlap(p, e)) {
      const prevBottom = p.prevY + p.h;
      if (p.vy > 0 && prevBottom <= e.y + 12) {
        damageEnemy(e, 2);
        p.vy = inp.jump ? -700 : -520;
        SFX.stomp();
      } else hurtPlayer(1, e.x + e.w / 2);
    }
  }
}

/* =========================================================================
   14. BOSS: LOBSTR.EXE
   ========================================================================= */
// Hit boxes in world space. Body+claw hurt the player; eyes are a weak spot (double damage).
function bossBoxes(b) {
  const f = b.facing;
  return {
    body: { x: b.cx - 95, y: b.by - 125, w: 190, h: 125 },
    claw: { x: f > 0 ? b.cx + 95 : b.cx - 190, y: b.by - 115, w: 95, h: 70 },
    eye:  { x: f > 0 ? b.cx + 35 : b.cx - 115, y: b.by - 205, w: 80, h: 80 },
  };
}
function setBossState(s) { boss.state = s; boss.timer = 0; }
function startBossFight() {
  game.bossActive = true;
  boss = createBoss();
  boss.state = 'intro'; boss.by = -40; boss.vy = 0; boss.glitch = 1;
  barrier = { x: ARENA_X0 - 30, y: -1000, w: 30, h: 1000 + GROUND_Y, kind: 'barrier' };
  solids.push(barrier);
  showBanner('WARNING: LOBSTR.EXE HAS ENTERED THE CHAT', '#ff3355', 3.2, 'the disfigured cyber-lobster awakens');
  SFX.alarm();
}
function resetBoss() {
  if (barrier) solids.splice(solids.indexOf(barrier), 1);
  barrier = null;
  boss = createBoss();
  bossBubbles = []; shockwaves = [];
  game.bossActive = false;
}
function spawnBossBubble(x) {
  bossBubbles.push({ x: clamp(x, ARENA_X0 + 25, ARENA_X1 - 25), y: -30, r: rand(14, 22), vy: rand(130, 190) * (1 + 0.15 * (boss.phase - 1)), t: rand(0, 6), glyph: pick(['?', '#', 'NaN', '0x0', '!', '404', '??']) });
  SFX.bubble();
}
function damageBoss(dmg, label, x, y) {
  const b = boss;
  if (!['walk', 'bubbles', 'slamWind', 'slamAir', 'slamRecover', 'chargeWind', 'charge', 'stunned'].includes(b.state)) return false;
  if (b.state === 'stunned') dmg *= 2;                  // punish the dizzy lobster
  b.hp -= dmg; b.flash = 0.1; b.glitch = Math.min(1, b.glitch + 0.35);
  addScore(25 * dmg); SFX.bossHit();
  if (label) addText(x, y, label, '#ffd23f', 16);
  if (b.hp <= 0) {
    b.hp = 0; setBossState('dying'); b.vx = 0;
    bossBubbles = []; shockwaves = []; eBullets = [];
    addScore(5000); SFX.roar(); game.shake = 20; doFlash('#ffffff', 0.7);
    showBanner('LOBSTR.EXE IS NOT RESPONDING', '#ffd23f', 3, 'force quitting crustacean...');
  }
  return true;
}
function bossLand() {
  const b = boss;
  game.shake = Math.max(game.shake, 20); SFX.slam();
  burst(b.cx - 90, GROUND_Y, 14, ['#ffe29a', '#ff3355', '#fff'], 260, 0.6, 5, 600);
  burst(b.cx + 90, GROUND_Y, 14, ['#ffe29a', '#ff3355', '#fff'], 260, 0.6, 5, 600);
  if (b.state === 'slamAir') {
    shockwaves.push({ x: b.cx - 100, dir: -1, speed: 440 + b.phase * 30 });
    shockwaves.push({ x: b.cx + 100, dir: 1, speed: 440 + b.phase * 30 });
    setBossState('slamRecover');
  } else if (b.state === 'intro') SFX.roar();
}
function chooseAttack() {
  const b = boss;
  const opts = ['bubbles', 'slam'];
  if (b.phase >= 2) opts.push('charge');
  let s = pick(opts);
  if (s === b.last) s = opts[(opts.indexOf(s) + 1) % opts.length];
  b.last = s;
  if (s === 'bubbles') { setBossState('bubbles'); b.spawnT = 0.3; b.bubbleCount = 0; SFX.roar(); }
  else if (s === 'slam') setBossState('slamWind');
  else { setBossState('chargeWind'); SFX.alarm(); }
}
function updateBoss(dt) {
  const b = boss, p = player;
  if (b.state === 'dormant') {
    if (!p.dead && p.x > ARENA_X0 + 90) startBossFight();
    return;
  }
  if (b.state === 'dead') return;
  b.anim += dt; b.timer += dt;
  b.flash = Math.max(0, b.flash - dt);
  b.glitch = Math.max(0, b.glitch - dt * 1.4);
  b.stompCd = Math.max(0, b.stompCd - dt);
  const pcx = p.x + p.w / 2;

  // Phase changes at 66% and 33% HP
  const frac = b.hp / BOSS_HP;
  const np = frac > 0.66 ? 1 : frac > 0.33 ? 2 : 3;
  if (np > b.phase && b.state !== 'dying') {
    b.phase = np; b.glitch = 1; SFX.roar(); game.shake = 12;
    showBanner(np === 2 ? 'PHASE 2 // CLAW.DLL OVERCLOCKED' : 'PHASE 3 // SHELL INTEGRITY CRITICAL', '#ff3fd8', 2.4);
    // Drop a health patch on the perch furthest from the boss
    const px = b.cx > (ARENA_X0 + ARENA_X1) / 2 ? 9205 : 9755;
    patches.push({ x: px, y: 285, taken: false });
  }
  const spd = 1 + (b.phase - 1) * 0.3;

  // Simple physics (boss only collides with arena floor + walls)
  b.vy += 2400 * dt; b.by += b.vy * dt; b.cx += b.vx * dt;
  if (b.by >= GROUND_Y) {
    if (!b.onGround && b.vy > 400) bossLand();
    b.by = GROUND_Y; b.vy = 0; b.onGround = true;
  } else b.onGround = false;
  const minX = ARENA_X0 + 110, maxX = ARENA_X1 - 110;
  b.cx = clamp(b.cx, minX, maxX);

  switch (b.state) {
    case 'intro':
      b.vx = 0; b.glitch = Math.max(b.glitch, 0.5);
      if (b.timer > 2.8) setBossState('walk');
      break;
    case 'walk': {
      b.facing = pcx < b.cx ? -1 : 1;
      const dist = Math.abs(pcx - b.cx);
      const want = dist > 240 ? b.facing : dist < 150 ? -b.facing : 0;
      b.vx = lerp(b.vx, want * 110 * spd, Math.min(1, dt * 4));
      if (b.phase === 3) { b.walkT -= dt; if (b.walkT <= 0) { spawnBossBubble(rand(ARENA_X0, ARENA_X1)); b.walkT = 1.1; } }
      if (b.timer > 2.1 - b.phase * 0.35) chooseAttack();
      break;
    }
    case 'bubbles':
      // Raise the spindly claw and summon falling glitch bubbles
      b.vx = lerp(b.vx, 0, Math.min(1, dt * 5));
      b.spawnT -= dt;
      if (b.spawnT <= 0) {
        spawnBossBubble(b.bubbleCount % 3 === 0 ? pcx : rand(ARENA_X0 + 30, ARENA_X1 - 30));
        b.bubbleCount++; b.spawnT = 0.36 - b.phase * 0.06;
      }
      if (b.timer > 2.8) setBossState('walk');
      break;
    case 'slamWind':
      b.vx = 0; b.facing = pcx < b.cx ? -1 : 1;
      if (b.timer > 0.55) {
        b.vy = -1000; b.onGround = false;
        const air = 2 * 1000 / 2400;
        b.vx = clamp((pcx - b.cx) / air, -620, 620);
        setBossState('slamAir');
      }
      break;
    case 'slamAir':
      break; // landing handled in bossLand()
    case 'slamRecover':
      b.vx = 0;
      if (b.timer > 0.7) {
        if (b.phase === 3 && !b.didDouble) { b.didDouble = true; setBossState('slamWind'); }
        else { b.didDouble = false; setBossState('walk'); }
      }
      break;
    case 'chargeWind':
      // Telegraph: shakes and eyes flash red, then dashes across the arena
      b.vx = 0; b.facing = pcx < b.cx ? -1 : 1; b.glitch = Math.max(b.glitch, 0.3);
      if (b.timer > 0.85) { b.chargeDir = b.facing; setBossState('charge'); }
      break;
    case 'charge':

      const srcY = i * sh, srcH = i === slices - 1 ? bossCanvas.height - srcY : sh;
      const off = Math.random() < g * 0.3 ? rand(-1, 1) * 28 * g : 0;
      ctx.drawImage(bossCanvas, 0, srcY, bossCanvas.width, srcH, dx + off, dy + srcY / BS, BC_W, srcH / BS);
    }
  } else ctx.drawImage(bossCanvas, dx, dy, BC_W, BC_H);
  // random glitch blocks
  if (g > 0.3) for (let i = 0; i < 4; i++) {
    ctx.fillStyle = pick(['rgba(44,245,255,0.5)', 'rgba(255,63,216,0.5)', 'rgba(255,255,255,0.4)']);
    ctx.fillRect(b.cx + rand(-150, 150), b.by - rand(20, 250), rand(10, 60), rand(2, 8));
  }
  ctx.restore();
  // charge telegraph
  if (b.state === 'chargeWind' && Math.floor(b.timer * 10) % 2 === 0) {
    ctx.fillStyle = '#ff3355'; ctx.font = `900 34px ${FONT}`; ctx.textAlign = 'center';
    ctx.fillText('!', b.cx, b.by - 250);
  }
}

/* =========================================================================
   22. RENDER: PROJECTILES, PARTICLES, BARRIER
   ========================================================================= */
function drawProjectiles(t) {
  // prompt bolts
  for (const bl of bolts) {
    bl.trail.forEach((p, i) => { ctx.fillStyle = `rgba(44,245,255,${(i + 1) / 12})`; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); });
    ctx.fillStyle = 'rgba(44,245,255,0.35)'; ctx.beginPath(); ctx.arc(bl.x, bl.y, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2cf5ff'; roundRect(ctx, bl.x - 8, bl.y - 3.5, 16, 7, 3.5); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = `900 12px ${FONT}`; ctx.textAlign = 'center';
    ctx.fillText(bl.vx > 0 ? '>' : '<', bl.x, bl.y + 4);
  }
  // terminal error packets
  for (const eb of eBullets) {
    ctx.fillStyle = 'rgba(255,77,109,0.35)'; ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.r + 5, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.translate(eb.x, eb.y); ctx.rotate(eb.rot);
    ctx.fillStyle = '#ff4d6d'; ctx.fillRect(-eb.r, -eb.r, eb.r * 2, eb.r * 2);
    ctx.restore();
    ctx.fillStyle = '#fff'; ctx.font = `bold 10px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('!', eb.x, eb.y + 4);
  }
  // boss glitch bubbles + ground warning shadows
  for (const bb of bossBubbles) {
    const near = clamp(bb.y / GROUND_Y, 0, 1);
    ctx.fillStyle = `rgba(255,51,85,${0.15 + near * 0.35})`;
    ctx.beginPath(); ctx.ellipse(bb.x, GROUND_Y + 2, bb.r * (0.5 + near * 0.7), 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,0,170,0.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(bb.x - 3, bb.y, bb.r, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(0,240,255,0.7)'; ctx.beginPath(); ctx.arc(bb.x + 3, bb.y, bb.r, 0, Math.PI * 2); ctx.stroke();
    const g = ctx.createRadialGradient(bb.x - 4, bb.y - 4, 2, bb.x, bb.y, bb.r);
    g.addColorStop(0, 'rgba(255,255,255,0.5)'); g.addColorStop(1, 'rgba(160,60,255,0.55)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bb.x, bb.y, bb.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = `bold 10px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText(bb.glyph, bb.x, bb.y + 4);
  }
  // shockwaves
  for (const s of shockwaves) {
    for (let k = 0; k < 6; k++) {
      const h = 10 + Math.abs(Math.sin(t * 30 + k)) * 22;
      ctx.fillStyle = k % 2 ? '#2cf5ff' : '#ff3fd8';
      ctx.fillRect(s.x - 18 + k * 6, GROUND_Y - h, 5, h);
    }
    ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(s.x - 22, GROUND_Y - 34, 44, 34);
  }
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const tx of texts) {
    ctx.globalAlpha = clamp(tx.life / tx.max * 1.5, 0, 1);
    ctx.font = `900 ${tx.size}px ${FONT}`;
    ctx.lineWidth = 4; ctx.strokeStyle = '#12062b'; ctx.strokeText(tx.text, tx.x, tx.y);
    ctx.fillStyle = tx.color; ctx.fillText(tx.text, tx.x, tx.y);
  }
  ctx.globalAlpha = 1;
}
function drawBarrier(t) {
  if (!barrier) return;
  for (let y = 0; y < GROUND_Y; y += 12) {
    const off = Math.sin(t * 20 + y) * 4;
    ctx.fillStyle = (Math.floor(y / 12 + t * 10) % 2) ? 'rgba(255,51,85,0.8)' : 'rgba(255,63,216,0.6)';
    ctx.fillRect(barrier.x + off, y, barrier.w, 10);
  }
  ctx.fillStyle = '#fff'; ctx.font = `bold 12px ${FONT}`; ctx.textAlign = 'center';
  'NO EXIT'.split('').forEach((ch, i) => ctx.fillText(ch, barrier.x + 15, 150 + i * 16));
}

/* =========================================================================
   23. RENDER: HUD
   ========================================================================= */
function panel(x, y, w, h, accent = '#2cf5ff') {
  ctx.fillStyle = 'rgba(10,6,30,0.75)'; roundRect(ctx, x, y, w, h, 8); ctx.fill();
  ctx.strokeStyle = accent; ctx.globalAlpha = 0.8; ctx.lineWidth = 1.5; ctx.stroke(); ctx.globalAlpha = 1;
  ctx.fillStyle = '#ff3fd8';
  ctx.fillRect(x + 6, y - 1, 14, 3); ctx.fillRect(x + w - 20, y + h - 2, 14, 3);
}
function hudText(txt, x, y, size, color, align = 'left') {
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = align;
  ctx.lineWidth = 4; ctx.strokeStyle = '#0a0418'; ctx.strokeText(txt, x, y);
  ctx.fillStyle = color; ctx.fillText(txt, x, y);
}
function drawHUD(t) {
  const p = player;
  // ---- Health + lives ----
  panel(12, 12, 250, 64);
  hudText('HERMES.AGENT', 24, 32, 13, '#9ffcff');
  hudText('INTEGRITY', 150, 32, 10, '#c9b8ff');
  for (let i = 0; i < PLAYER_MAX_HP; i++) {
    const x = 24 + i * 30, y = 40;
    ctx.fillStyle = '#1a1030'; ctx.fillRect(x, y, 26, 14);
    if (i < p.hp) {
      const low = p.hp <= 2;
      if (!(p.hp === 1 && Math.floor(t * 6) % 2)) {
        const g = ctx.createLinearGradient(x, y, x, y + 14);
        g.addColorStop(0, low ? '#ffd23f' : '#39ff88'); g.addColorStop(1, low ? '#ff4d6d' : '#2cf5ff');
        ctx.fillStyle = g; ctx.fillRect(x + 1, y + 1, 24, 12);
        ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(x + 1, y + 1, 24, 3);
      }
    }
    ctx.strokeStyle = '#4b3a8a'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, 25, 13);
  }
  drawHermes(ctx, 190, 66, 1, t, { scale: 0.5 });
  hudText('x' + game.lives, 204, 64, 14, '#ffd23f');

  // ---- Score + tokens ----
  panel(VIEW_W - 232, 12, 220, 64);
  hudText('SCORE', VIEW_W - 220, 32, 11, '#c9b8ff');
  hudText(String(game.score).padStart(7, '0'), VIEW_W - 24, 34, 20, '#fff', 'right');
  drawToken(VIEW_W - 208, 57, t);
  hudText(`${game.tokens} / ${game.totalTokens}`, VIEW_W - 190, 62, 14, '#ffd23f');
  hudText('TOKENS', VIEW_W - 24, 62, 10, '#c9b8ff', 'right');

  // ---- Progress bar ----
  const bx = 300, by = 26, bw = 360, bh = 10;
  panel(bx - 14, 12, bw + 28, 40, '#c77dff');
  const endX = ARENA_X0 + 100;
  const prog = clamp(p.x / endX, 0, 1);
  ZONES.forEach((z, i) => {
    const a = clamp(Math.max(0, z.start) / endX, 0, 1), b = clamp((ZONES[i + 1] ? ZONES[i + 1].start : endX) / endX, 0, 1);
    ctx.fillStyle = z.color; ctx.globalAlpha = 0.25; ctx.fillRect(bx + a * bw, by, (b - a) * bw, bh);
    ctx.globalAlpha = 1;
    const fb = Math.min(b, prog);
    if (fb > a) { ctx.fillStyle = z.color; ctx.fillRect(bx + a * bw, by, (fb - a) * bw, bh); }
  });
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
  for (const c of checkpoints) {
    const cx = bx + (c.x / endX) * bw;
    ctx.fillStyle = c.active ? '#39ff88' : '#666'; ctx.fillRect(cx - 1.5, by - 3, 3, bh + 6);
  }
  // player marker + lobster icon at the end
  const mx = bx + prog * bw;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(mx, by + bh + 2); ctx.lineTo(mx - 5, by + bh + 9); ctx.lineTo(mx + 5, by + bh + 9); ctx.fill();
  ctx.fillStyle = '#ff3355'; ctx.beginPath(); ctx.ellipse(bx + bw + 4, by + 5, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(bx + bw + 11, by, 3, 0, Math.PI * 2); ctx.arc(bx + bw + 11, by + 10, 2, 0, Math.PI * 2); ctx.fill();
  hudText('PROGRESS ' + Math.floor(prog * 100) + '%', bx + bw / 2, by + 24, 10, '#e0d0ff', 'center');

  // ---- Boss health bar ----
  if (boss.state !== 'dormant' && boss.state !== 'dead') {
    const w = 520, x = (VIEW_W - w) / 2, y = VIEW_H - 50;
    panel(x - 12, y - 24, w + 24, 50, '#ff3355');
    const j = Math.random() < 0.1 ? rand(-3, 3) : 0;
    hudText('LOBSTR.EXE', x + j, y - 6, 14, '#ff3355');
    hudText('// DISFIGURED CYBER-LOBSTER  PHASE ' + boss.phase, x + 110, y - 6, 10, '#ffb3c1');
    ctx.fillStyle = '#20040c'; ctx.fillRect(x, y, w, 14);
    const frac = boss.hp / BOSS_HP;
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#ff3fd8'); g.addColorStop(1, '#ff3355');
    ctx.fillStyle = g; ctx.fillRect(x, y, w * frac, 14);
    ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(x, y, w * frac, 4);
    ctx.fillStyle = '#0a0418';
    for (let i = 1; i < 12; i++) ctx.fillRect(x + (w / 12) * i, y, 2, 14);
    ctx.strokeStyle = '#ff99aa'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, 13);
  }

  // ---- Zone / event banner ----
  if (game.banner) {
    const bn = game.banner;
    const a = clamp(Math.min(bn.t, bn.max - bn.t) * 3, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(10,4,26,0.7)'; ctx.fillRect(0, 118, VIEW_W, bn.sub ? 64 : 46);
    ctx.fillStyle = bn.color; ctx.fillRect(0, 118, VIEW_W, 2); ctx.fillRect(0, bn.sub ? 180 : 162, VIEW_W, 2);
    const slide = (1 - a) * 40;
    hudText(bn.text, VIEW_W / 2 + slide, 150, 24, bn.color, 'center');
    if (bn.sub) hudText(bn.sub, VIEW_W / 2 - slide, 172, 13, '#e0d0ff', 'center');
    ctx.globalAlpha = 1;
  }
  hudText(Sound.muted ? '[M] SOUND OFF' : '[M] SOUND ON', 14, VIEW_H - 12, 10, 'rgba(255,255,255,0.5)');
  hudText('[P] PAUSE', VIEW_W - 14, VIEW_H - 12, 10, 'rgba(255,255,255,0.5)', 'right');
}

/* =========================================================================
   24. RENDER: SCREENS (start, pause, win, game over)
   ========================================================================= */
function glitchTitle(txt, x, y, size, t, grad = ['#fff7ae', '#ffd23f', '#ff7a3c']) {
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = 'center';
  const j = Math.sin(t * 23) > 0.9 ? rand(-6, 6) : 0;
  ctx.lineWidth = 10; ctx.strokeStyle = '#12062b'; ctx.strokeText(txt, x, y);
  ctx.fillStyle = '#ff3fd8'; ctx.fillText(txt, x - 3 + j, y + 2);
  ctx.fillStyle = '#2cf5ff'; ctx.fillText(txt, x + 3 - j, y - 2);
  const g = ctx.createLinearGradient(0, y - size, 0, y);
  g.addColorStop(0, grad[0]); g.addColorStop(0.5, grad[1]); g.addColorStop(1, grad[2]);
  ctx.fillStyle = g; ctx.fillText(txt, x, y);
  if (j) { ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillRect(x - size * 3, y - size * 0.5 + j * 3, size * 6, 3); }
}
function dim(a) { ctx.fillStyle = `rgba(8,4,24,${a})`; ctx.fillRect(0, 0, VIEW_W, VIEW_H); }
const demoBoss = { hp: BOSS_HP * 0.6, state: 'walk', vx: 60 };
function drawStartScreen(t) {
  dim(0.45);
  glitchTitle('HERMES AGENT', VIEW_W / 2, 105, 74, t);
  hudText('vs. THE DISFIGURED CYBER-LOBSTER', VIEW_W / 2, 145, 22, '#ff3fd8', 'center');
  hudText('a journey across the chaotic digital shoreline', VIEW_W / 2, 170, 13, '#e0d0ff', 'center');
  // Hero showcase
  ctx.fillStyle = 'rgba(44,245,255,0.18)'; ctx.beginPath(); ctx.ellipse(190, 402, 70, 12, 0, 0, Math.PI * 2); ctx.fill();
  drawHermes(ctx, 190, 400, 1, t, { scale: 3.3 });
  hudText('< HERMES >', 190, 428, 13, '#9ffcff', 'center');
  // Boss teaser
  ctx.save(); ctx.translate(790, 410); ctx.scale(-0.62, 0.62);
  ctx.globalAlpha = Math.random() < 0.05 ? 0.5 : 1;
  drawBossArt(ctx, demoBoss, t);
  ctx.restore(); ctx.globalAlpha = 1;
  hudText('< LOBSTR.EXE >', 790, 432, 13, '#ff3355', 'center');
  // Controls
  const px = 330, py = 196;
  panel(px, py, 300, 196);
  hudText('> CONTROLS.TXT', px + 16, py + 24, 13, '#39ff88');
  const lines = [['MOVE', 'A D / ← →'], ['JUMP', 'SPACE / W / ↑'], ['SHOOT', 'J / LEFT CLICK'], ['DROP', 'S / ↓ on platform'], ['PAUSE', 'P / ESC'], ['SOUND', 'M'], ['RESTART', 'R (after win/loss)']];
  lines.forEach(([k, v], i) => {
    hudText(k, px + 16, py + 50 + i * 20, 12, '#ffd23f');
    hudText(v, px + 284, py + 50 + i * 20, 12, '#fff', 'right');
  });
  if (Math.floor(t * 2.2) % 2 === 0) hudText('PRESS ENTER / SPACE / CLICK TO BOOT', VIEW_W / 2, 430, 18, '#2cf5ff', 'center');
  hudText('Collect tokens, stomp or zap bugs, reach checkpoints, decompile the lobster.', VIEW_W / 2, 452, 11, '#ffffffcc', 'center');
  if (game.best > 0) hudText('BEST SCORE ' + game.best, VIEW_W / 2, 525, 12, '#ffd23f', 'center');
}
function drawPause(t) {
  dim(0.6);
  glitchTitle('PAUSED', VIEW_W / 2, 250, 64, t, ['#ffffff', '#9ffcff', '#2cf5ff']);
  hudText('process suspended // press P, ESC or click to resume', VIEW_W / 2, 290, 14, '#e0d0ff', 'center');
  hudText('press R to reboot from the beginning', VIEW_W / 2, 314, 12, '#ffd23f', 'center');
}
function fmtTime(s) { const m = Math.floor(s / 60), r = Math.floor(s % 60); return m + ':' + String(r).padStart(2, '0'); }
function drawStats(y, rows) {
  const w = 360, x = (VIEW_W - w) / 2;
  panel(x, y, w, 26 + rows.length * 24);
  rows.forEach(([k, v, c], i) => {
    hudText(k, x + 20, y + 30 + i * 24, 14, '#c9b8ff');
    hudText(v, x + w - 20, y + 30 + i * 24, 14, c || '#fff', 'right');
  });
}
function drawWin(t) {
  dim(0.55);
  const a = clamp(game.screenTime * 2, 0, 1);
  ctx.globalAlpha = a;
  glitchTitle('LOBSTER DECOMPILED!', VIEW_W / 2, 125, 56, t, ['#ffffff', '#39ff88', '#2cf5ff']);
  hudText('The shoreline is stable again. Hermes Agent saves the day (and the tokens).', VIEW_W / 2, 162, 14, '#e0d0ff', 'center');
  const pct = game.tokens / game.totalTokens;
  const rank = game.lives === START_LIVES && pct > 0.8 ? 'S // PROMPT SORCERER' : pct > 0.6 ? 'A // SENIOR AGENT' : pct > 0.35 ? 'B // JUNIOR AGENT' : 'C // INTERN.EXE';
  drawStats(190, [
    ['SCORE', String(game.score), '#ffd23f'],
    ['TOKENS', `${game.tokens} / ${game.totalTokens}`],
    ['TIME', fmtTime(game.runTime)],
    ['LIVES LEFT', `${game.lives} (+${game.lives * 1000})`],
    ['RANK', rank, '#39ff88'],
    ['BEST', String(game.best) + (game.newBest ? '  NEW!' : ''), game.newBest ? '#ff3fd8' : '#fff'],
  ]);
  drawHermes(ctx, 180, 420, 1, t * 1.5, { scale: 2.6, run: 0, air: Math.sin(t * 4) > 0.3, vy: -300 });
  drawHermes(ctx, 780, 420, -1, t * 1.5 + 1, { scale: 2.6, run: 0, air: Math.sin(t * 4 + 2) > 0.3, vy: -300 });
  if (Math.floor(t * 2.2) % 2 === 0) hudText('PRESS R TO PLAY AGAIN', VIEW_W / 2, 470, 20, '#2cf5ff', 'center');
  ctx.globalAlpha = 1;
  for (const c of confetti) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.fillStyle = c.color; ctx.fillRect(-c.s / 2, -c.s / 4, c.s, c.s / 2);
    ctx.restore();
  }
}
function drawGameOver(t) {
  dim(0.65);
  const a = clamp(game.screenTime * 2, 0, 1);
  ctx.globalAlpha = a;
  // screen tear lines
  for (let i = 0; i < 6; i++) { ctx.fillStyle = `rgba(255,51,85,${0.1 + hash(i + Math.floor(t * 10)) * 0.2})`; ctx.fillRect(0, hash(i * 7 + Math.floor(t * 10)) * VIEW_H, VIEW_W, 3); }
  glitchTitle('SEGMENTATION FAULT', VIEW_W / 2, 140, 54, t, ['#ffffff', '#ff7a8a', '#ff3355']);
  hudText('Hermes Agent was garbage-collected by the chaos. (core dumped)', VIEW_W / 2, 178, 14, '#e0d0ff', 'center');
  drawStats(208, [
    ['SCORE', String(game.score), '#ffd23f'],
    ['TOKENS', `${game.tokens} / ${game.totalTokens}`],
    ['PROGRESS', Math.floor(clamp(player.x / (ARENA_X0 + 100), 0, 1) * 100) + '%'],
    ['BEST', String(game.best) + (game.newBest ? '  NEW!' : ''), game.newBest ? '#ff3fd8' : '#fff'],
  ]);
  drawHermes(ctx, VIEW_W / 2, 430, 1, 0.5, { scale: 2, hurt: true });
  if (Math.floor(t * 2.2) % 2 === 0) hudText('PRESS R TO REBOOT', VIEW_W / 2, 480, 20, '#2cf5ff', 'center');
  ctx.globalAlpha = 1;
}

/* =========================================================================
   25. MAIN RENDER
   ========================================================================= */
function render() {
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  const t = game.time;
  const camX = game.state === 'start' ? (t * 50) % 2600 : camera.x;
  const sx = game.shake > 0 ? rand(-1, 1) * game.shake : 0;
  const sy = game.shake > 0 ? rand(-1, 1) * game.shake : 0;

  drawBackground(camX, t);
  ctx.save();
  ctx.translate(-camX + sx, sy);
  drawDataSea(camX, t);
  if (game.state === 'start') {
    // demo ground strip for the title screen
    for (let x = Math.floor(camX / 40) * 40; x < camX + VIEW_W + 40; x += 40) drawGroundTile(x, 40, 0, Math.floor(x / 40), t);
  } else {
    drawTerrain(camX, t);
    drawPickups(t);
    drawEnemies(t);
    drawBoss(t);
    drawPlayer(t);
    drawProjectiles(t);
    drawBarrier(t);
    drawParticles();
  }
  ctx.restore();

  if (game.state === 'start') drawStartScreen(t);
  else {
    drawHUD(t);
    if (game.state === 'paused') drawPause(t);
    else if (game.state === 'win') drawWin(t);
    else if (game.state === 'gameover') drawGameOver(t);
  }
  if (game.flash > 0) {
    ctx.globalAlpha = Math.min(0.8, game.flash);
    ctx.fillStyle = game.flashColor; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.globalAlpha = 1;
  }
}

/* =========================================================================
   26. MAIN LOOP (requestAnimationFrame + fixed-step physics)
   ========================================================================= */
let last = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.1) dt = 0.1;               // avoid spiral of death after tab switches
  acc += dt;
  while (acc >= FIXED_DT) { update(FIXED_DT); acc -= FIXED_DT; }
  Music.update();
  render();
  requestAnimationFrame(frame);
}
// Build a world immediately so every system has valid data even on the title screen
buildWorld();
player = createPlayer(80);
boss = createBoss();
bolts = []; eBullets = []; bossBubbles = []; shockwaves = [];
respawn = { x: 80 };
requestAnimationFrame(frame);
})();
</script>
