<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HERMES://SHORE — qwen3.8-flash-next</title>
<style>
  /* ===== Page chrome: the canvas is the whole app ===== */
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05030d;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    /* pixel-crisp scaling, letterboxed by JS resize */
    image-rendering: pixelated;
    box-shadow: 0 0 60px rgba(57, 255, 204, .18), 0 0 120px rgba(255, 45, 85, .10);
    background: #0b0620;
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<script>
"use strict";
/* =========================================================================
 * HERMES://SHORE — a one-file side-scroller
 * A tiny hooded terminal explorer crosses a chaotic digital shoreline
 * (beach + server room + cyberpunk terminal) to fight GLITCHLAW,
 * a disfigured cyber-lobster.
 *
 * Vanilla JS + canvas only. No assets. Sections:
 *   1. Setup / responsive canvas      5. Entities (player/enemies/boss)
 *   2. Audio bleeps                   6. Update loop
 *   3. Level data                     7. Render (parallax, world, HUD, screens)
 *   4. Input                          8. Main loop
 * ========================================================================= */

/* ---------- 1. Setup / responsive canvas ------------------------------- */
const W = 960, H = 540;                 // internal resolution
const cv  = document.getElementById("game");
const ctx = cv.getContext("2d");

// Fit the 960x540 canvas into the window, keeping aspect ratio.
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width  = Math.floor(W * s) + "px";
  cv.style.height = Math.floor(H * s) + "px";
}
addEventListener("resize", resize); resize();

const WORLD_W = 9600;                   // total level width in world px
const GROUND_Y = 470;                   // top of ground segments
const GRAV = 0.55, MAXFALL = 13;        // physics constants
const JUMPV = -12.5;                    // jump impulse (~140px full-hold rise)
const COYOTE = 7, JBUF = 8;             // jump feel: coyote frames / buffered jump frames

/* ---------- 2. Audio bleeps (tiny WebAudio synth) ---------------------- */
let AC = null;                          // created lazily on first key press
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return AC; }
function tone(f0, f1, dur, type, vol, when) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + (when || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || "square";
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol || 0.05, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
// named sound effects
const sfx = {
  jump:   () => tone(240, 560, .14, "square", .04),
  shoot:  () => tone(880, 220, .09, "sawtooth", .035),
  token:  () => { tone(880, 880, .06, "square", .04); tone(1320, 1320, .09, "square", .04, .06); },
  hitE:   () => tone(300, 90, .12, "square", .05),
  kill:   () => { tone(400, 80, .2, "sawtooth", .06); tone(160, 40, .25, "triangle", .05, .05); },
  hurt:   () => tone(180, 60, .25, "sawtooth", .07),
  cp:     () => { tone(523, 523, .08, "square", .05); tone(784, 784, .12, "square", .05, .09); },
  roar:   () => { tone(120, 40, .6, "sawtooth", .09); tone(90, 30, .7, "triangle", .07, .1); },
  boom:   () => tone(200, 30, .4, "sawtooth", .08),
  win:    () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, .18, "square", .05, i * .14)); },
  lose:   () => { [392, 330, 262, 196].forEach((f, i) => tone(f, f * .9, .25, "sawtooth", .05, i * .18)); },
};

/* ---------- 3. Level data ---------------------------------------------- */
// Ground segments (solid). Gaps between them are deadly glitch-pits.
const grounds = [
  [0, 1500], [1650, 2700], [2860, 4100], [4260, 5500], [5660, 6900], [7060, 9600]
].map(g => ({ x: g[0], y: GROUND_Y, w: g[1] - g[0], h: 200 }));

// Floating platforms (also solid).
const plats = [
  [520, 360, 120], [760, 280, 120], [1060, 350, 140], [1380, 300, 120],
  [1560, 380, 90],                       // hop-stepping stone over pit #1
  [1900, 350, 120], [2180, 270, 140], [2500, 340, 120],
  [2760, 380, 100],                      // stone over pit #2
  [3050, 300, 140], [3380, 240, 120], [3700, 330, 140],
  [4160, 380, 100],                      // stone over pit #3
  [4450, 320, 120], [4780, 250, 140], [5120, 340, 120],
  [5560, 380, 100],                      // stone over pit #4
  [5900, 300, 140], [6260, 240, 120], [6600, 330, 140],
  [6960, 380, 100],                      // stone over pit #5
  [7350, 320, 120], [7700, 260, 140],
].map(p => ({ x: p[0], y: p[1], w: p[2], h: 18 }));

const solids = grounds.concat(plats);    // everything the player collides with

// Token arcs strung over the pits (risk/reward).
function arc(x0, x1) {
  const out = [], n = 4;
  for (let i = 0; i < n; i++) {
    const t = (i + 1) / (n + 1);
    out.push({ x: x0 + (x1 - x0) * t, y: 330 - Math.sin(t * Math.PI) * 70 });
  }
  return out;
}
// Hand-placed token spots + pit arcs.
const TOKEN_SPOTS = [
  [560, 320], [600, 320], [800, 240], [840, 240], [1100, 310], [1140, 310], [1180, 310],
  [1420, 260], [1460, 260], [1950, 310], [1990, 310], [2220, 230], [2260, 230], [2300, 230],
  [2540, 300], [2580, 300], [3090, 260], [3130, 260], [3420, 200], [3460, 200],
  [3740, 290], [3780, 290], [4490, 280], [4530, 280], [4820, 210], [4860, 210], [4900, 210],
  [5160, 300], [5200, 300], [5940, 260], [5980, 260], [6300, 200], [6340, 200], [6380, 200],
  [6640, 290], [6680, 290], [7390, 280], [7430, 280], [7740, 220], [7780, 220], [7820, 220],
].map(p => ({ x: p[0], y: p[1] }));
const TOKEN_ALL = TOKEN_SPOTS.concat(
  arc(1500, 1650), arc(2700, 2860), arc(4100, 4260), arc(5500, 5660), arc(6900, 7060)
);

// Checkpoints: glowing server racks. Touching one saves your spawn + heals.
const CP_XS = [1400, 3200, 5000, 6800];

// Boss trigger + arena walls (invisible, active during the fight).
const BOSS_TRIGGER = 8720;
const WALL_L = 8780, WALL_R = 9560;

/* ---------- 4. Input ---------------------------------------------------- */
const keys = {};
let mouseDown = false;
addEventListener("keydown", e => {
  audio();                              // unlock audio on first gesture
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(e.code)) e.preventDefault();
  if (!e.repeat) onPress(e.code);
  keys[e.code] = true;
});
addEventListener("keyup", e => { keys[e.code] = false; });
cv.addEventListener("mousedown", e => { audio(); if (e.button === 0) { mouseDown = true; shoot(); } });
addEventListener("mouseup", () => { mouseDown = false; });

function onPress(code) {
  if (state === "start" && (code === "Enter" || code === "Space")) { startRun(); return; }
  if ((state === "win" || state === "over") && code === "KeyR") { startRun(); return; }
  if (state === "play") {
    if (code === "KeyR") { startRun(); return; }          // hard restart anytime
    if (code === "Space" || code === "ArrowUp" || code === "KeyW") jumpBuf = JBUF;
    if (code === "KeyJ") shoot();                          // keyboard fire (hold handled in update)
  }
}
const left  = () => keys.ArrowLeft  || keys.KeyA;
const right = () => keys.ArrowRight || keys.KeyD;

/* ---------- 5. Entities -------------------------------------------------- */
let state = "start";                    // start | play | win | over
let run = null;                         // per-attempt game state
let frame = 0;                          // global frame counter (for idle anims)
let jumpBuf = 0;                        // buffered jump frames (set on press, spent in update)

function newRun() {
  return {
    player: { x: 120, y: GROUND_Y - 40, w: 26, h: 40, vx: 0, vy: 0, face: 1,
              hp: 6, inv: 0, coyote: 0, anim: 0, shootCd: 0 },
    cam: 0,
    bolts: [], parts: [], bubbles: [],
    tokens: TOKEN_ALL.map(t => ({ x: t.x, y: t.y, got: false })),
    enemies: [
      // corrupted shellfish (crabs): patrol between bounds
      ...[[700, 620, 950], [1850, 1700, 2150], [2300, 2150, 2620], [3300, 3000, 3550],
          [3900, 3650, 4080], [4700, 4400, 4950], [5300, 5050, 5480], [6100, 5800, 6350],
          [6700, 6450, 6880], [7500, 7200, 7650]]
        .map(c => ({ type: "crab", x: c[0], y: GROUND_Y - 26, w: 34, h: 26, dir: 1,
                     min: c[1], max: c[2], hp: 2, flash: 0 })),
      // rogue terminals: hop in place, pop error windows
      ...[[1150, GROUND_Y - 34], [2950, GROUND_Y - 34], [4500, GROUND_Y - 34],
          [6300, GROUND_Y - 34], [7850, GROUND_Y - 34]]
        .map(t => ({ type: "term", x: t[0], y: t[1], w: 32, h: 34, vy: 0, grounded: true,
                     timer: Math.random() * 60 + 40, hp: 3, flash: 0 })),
      // floating error bubbles: bob and drift
      ...[[950, 220], [1750, 200], [2600, 180], [3550, 210], [4350, 190],
          [5250, 220], [6050, 180], [6850, 210], [7650, 190]]
        .map(b => ({ type: "bub", x: b[0], y: b[1], w: 30, h: 30, baseY: b[1],
                     ph: Math.random() * 6.28, dx: (Math.random() < .5 ? -1 : 1) * .4,
                     hp: 1, flash: 0 })),
    ],
    cps: CP_XS.map(x => ({ x, on: false })),
    spawnX: 120,
    score: 0, tokensGot: 0,
    toast: null,                        // {text, t}
    shake: 0,
    boss: { active: false, dead: false, deathT: 0, x: 9250, y: GROUND_Y - 130,
            w: 220, h: 130, hp: 40, maxhp: 40, state: "idle", t: 120, hitFlash: 0,
            dashTo: 0, vx: 0 },
    bossWall: false,
    winT: 0,
  };
}
function startRun() { run = newRun(); state = "play"; }

function toast(text) { run.toast = { text, t: 150 }; }

// particles: {x,y,vx,vy,life,col,size}
function burst(x, y, n, cols, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (Math.random() * .7 + .3) * (spd || 4);
    run.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1,
                     life: 30 + Math.random() * 25,
                     col: cols[(Math.random() * cols.length) | 0], size: 2 + Math.random() * 3 });
  }
}

/* ---------- shooting ----------------------------------------------------- */
function shoot() {
  if (state !== "play" || !run) return;
  const p = run.player;
  if (p.shootCd > 0) return;
  p.shootCd = 12;
  run.bolts.push({ x: p.x + p.w / 2 + p.face * 18, y: p.y + 22, vx: p.face * 11, life: 90 });
  sfx.shoot();
}

/* ---------- damage / respawn -------------------------------------------- */
function hurtPlayer(dmg, fromX) {
  const p = run.player;
  if (p.inv > 0) return;
  p.hp -= dmg; p.inv = 72;                       // ~1.2s of i-frames
  p.vx = (p.x + p.w / 2 < fromX ? -1 : 1) * 6;   // knockback away from hit
  p.vy = -5;
  run.shake = Math.max(run.shake, 8);
  sfx.hurt();
  if (p.hp <= 0) { state = "over"; sfx.lose(); }
}
function pitDeath() {
  const p = run.player;
  p.hp -= 2;
  sfx.boom();
  burst(p.x + p.w / 2, H - 30, 26, ["#39ffcc", "#ff2d55", "#b06bff"], 5);
  if (p.hp <= 0) { state = "over"; sfx.lose(); return; }
  // respawn at last checkpoint; sweep bubbles near spawn so we don't get camped
  p.x = run.spawnX; p.y = GROUND_Y - p.h - 2; p.vx = 0; p.vy = 0; p.inv = 90;
  run.bubbles = run.bubbles.filter(b => Math.abs(b.x - run.spawnX) > 400);
  toast("REBOOTED AT CHECKPOINT");
}

/* ---------- 6. Update ----------------------------------------------------- */
function update() {
  const p = run.player, b = run.boss;
  frame++;

  /* --- player movement --- */
  const ACC = .55, FRIC = .82, MAXV = 4.4;
  if (left())  { p.vx -= ACC; p.face = -1; }
  if (right()) { p.vx += ACC; p.face = 1; }
  if (!left() && !right()) p.vx *= FRIC;
  p.vx = Math.max(-MAXV, Math.min(MAXV, p.vx));

  // jump: buffered + coyote time for good feel
  if (jumpBuf > 0) {
    if (p.coyote > 0) { p.vy = JUMPV; p.coyote = 0; p.rising = true; jumpBuf = 0; sfx.jump(); }
    else jumpBuf--;
  }
  // variable jump height: releasing early cuts the rise ONCE (not every frame)
  if (p.rising && p.vy < 0 && !keys.Space && !keys.ArrowUp && !keys.KeyW) { p.vy *= .62; p.rising = false; }
  p.vy = Math.min(MAXFALL, p.vy + GRAV);

  const prevBottom = p.y + p.h;
  p.x += p.vx;
  // horizontal collisions
  for (const s of solids) {
    if (p.x < s.x + s.w && p.x + p.w > s.x && p.y < s.y + s.h && p.y + p.h > s.y) {
      if (p.vx > 0) p.x = s.x - p.w; else if (p.vx < 0) p.x = s.x + s.w;
      p.vx = 0;
    }
  }
  // arena walls during the boss fight
  if (run.bossWall) {
    if (p.x < WALL_L) { p.x = WALL_L; p.vx = 0; }
    if (p.x + p.w > WALL_R) { p.x = WALL_R - p.w; p.vx = 0; }
  } else if (p.x < 0) { p.x = 0; p.vx = 0; }

  p.y += p.vy;
  p.grounded = false;
  for (const s of solids) {
    if (p.x < s.x + s.w && p.x + p.w > s.x && p.y < s.y + s.h && p.y + p.h > s.y) {
      if (p.vy > 0 && prevBottom <= s.y + 1) { p.y = s.y - p.h; p.vy = 0; p.grounded = true; }
      else if (p.vy < 0 && prevBottom - p.h >= s.y + s.h - 1) { p.y = s.y + s.h; p.vy = 0; }
      else if (p.vy >= 0) {
        // deep overlap (spawned/embedded in a solid): push out the nearest way
        const up = p.y + p.h - s.y, down = s.y + s.h - p.y;
        if (up < down) { p.y = s.y - p.h; p.vy = 0; p.grounded = true; }
        else { p.y = s.y + s.h; p.vy = 0; }
      }
      else if (p.vx > 0) { p.x = s.x - p.w; }
      else if (p.vx < 0) { p.x = s.x + s.w; }
    }
  }
  if (p.grounded) p.rising = false;     // jump-cut only applies mid-rise
  if (p.grounded) p.coyote = COYOTE; else p.coyote--;
  if (p.inv > 0) p.inv--;
  if (p.shootCd > 0) p.shootCd--;
  if (mouseDown) shoot();                       // hold-to-fire
  p.anim += Math.abs(p.vx) * .12;               // walk-cycle phase

  // fell into a glitch pit
  if (p.y > H + 60) pitDeath();

  /* --- camera follows player --- */
  const target = Math.max(0, Math.min(WORLD_W - W, p.x + p.w / 2 - W * .42));
  run.cam += (target - run.cam) * .12;

  /* --- bolts fly and hit things --- */
  for (const bo of run.bolts) {
    bo.x += bo.vx; bo.life--;
    for (const e of run.enemies) {
      if (e.hp > 0 && bo.x > e.x - 4 && bo.x < e.x + e.w + 4 && bo.y > e.y - 4 && bo.y < e.y + e.h + 4) {
        e.hp--; e.flash = 6; bo.life = 0;
        burst(bo.x, bo.y, 5, ["#39ffcc", "#ffe600"], 3);
        if (e.hp <= 0) {
          const pts = e.type === "crab" ? 25 : e.type === "term" ? 40 : 15;
          run.score += pts; sfx.kill();
          burst(e.x + e.w / 2, e.y + e.h / 2, 16, ["#39ffcc", "#ff2d55", "#b06bff"], 4);
        } else sfx.hitE();
      }
    }
    // boss hit (only while alive and engaged)
    if (b.active && !b.dead && bo.life > 0 &&
        bo.x > b.x && bo.x < b.x + b.w && bo.y > b.y && bo.y < b.y + b.h) {
      bo.life = 0;
      if (b.hitFlash <= 0) {
        b.hp -= 2; b.hitFlash = 8; run.shake = Math.max(run.shake, 4);
        burst(bo.x, bo.y, 6, ["#39ffcc", "#ffe600", "#ff2d55"], 4);
        sfx.hitE();
        if (b.hp <= 0) {
          b.dead = true; b.deathT = 90; sfx.roar(); run.shake = 14;
        }
      }
    }
  }
  // cull only bolts that left the viewport (camera may lag after respawns/teleports)
  run.bolts = run.bolts.filter(bo => bo.life > 0 && bo.x > run.cam - 80 && bo.x < run.cam + W + 80);
  run.enemies = run.enemies.filter(e => e.hp > 0);

  /* --- enemies --- */
  for (const e of run.enemies) {
    if (e.flash > 0) e.flash--;
    if (e.type === "crab") {
      e.x += e.dir * 1.2;
      if (e.x < e.min) { e.x = e.min; e.dir = 1; }
      if (e.x + e.w > e.max) { e.x = e.max - e.w; e.dir = -1; }
    } else if (e.type === "term") {
      e.timer--;
      if (e.grounded && e.timer <= 0) {          // hop toward the player
        e.vy = -8.5; e.grounded = false;
        e.dx = Math.sign(p.x - e.x) * (1 + Math.random());
        e.timer = 110 + Math.random() * 60;
      }
      if (!e.grounded) {
        e.vy = Math.min(MAXFALL, e.vy + GRAV);
        e.y += e.vy; e.x += e.dx || 0;
        for (const s of solids) {
          if (e.x < s.x + s.w && e.x + e.w > s.x && e.y + e.h > s.y && e.y + e.h < s.y + 24 && e.vy > 0) {
            e.y = s.y - e.h; e.vy = 0; e.grounded = true;
          }
        }
      }
    } else if (e.type === "bub") {
      e.ph += .05;
      e.y = e.baseY + Math.sin(e.ph) * 16;
      // drift toward the player when close, otherwise patrol
      const d = p.x - e.x;
      if (Math.abs(d) < 260) e.x += Math.sign(d) * .5;
      else e.x += e.dx;
    }
    // touch damage
    if (p.inv <= 0 && p.x < e.x + e.w && p.x + p.w > e.x && p.y < e.y + e.h && p.y + p.h > e.y) {
      hurtPlayer(1, e.x + e.w / 2);
    }
  }

  /* --- tokens --- */
  for (const t of run.tokens) {
    if (!t.got && Math.abs(p.x + p.w / 2 - t.x) < 20 && Math.abs(p.y + p.h / 2 - t.y) < 24) {
      t.got = true; run.tokensGot++; run.score += 10; sfx.token();
      burst(t.x, t.y, 6, ["#ffe600", "#ffb300"], 2.5);
    }
  }

  /* --- checkpoints --- */
  for (const c of run.cps) {
    if (!c.on && Math.abs(p.x + p.w / 2 - c.x) < 30) {
      c.on = true; run.spawnX = c.x - 13; p.hp = 6;
      toast("CHECKPOINT // SIGNAL LOCKED"); sfx.cp();
      burst(c.x, GROUND_Y - 40, 14, ["#39ffcc", "#ffe600"], 3);
    }
  }

  /* --- boss trigger --- */
  if (!b.active && p.x > BOSS_TRIGGER) {
    b.active = true; run.bossWall = true; b.t = 45;   // engage fast
    toast("WARNING // GLITCHLAW ONLINE"); sfx.roar();
  }

  /* --- boss AI: idle chase → slam (glitch bubbles) → dash --- */
  if (b.active && !b.dead) {
    if (b.hitFlash > 0) b.hitFlash--;
    b.t--;
    const cx = b.x + b.w / 2;
    if (b.state === "idle") {
      // shamble toward the player, keep inside arena
      b.x += Math.sign(p.x - cx) * 1.3;
      b.x = Math.max(WALL_L, Math.min(WALL_R - b.w, b.x));
      if (b.t <= 0) {
        if (Math.random() < .55) { b.state = "slamT"; b.t = 40; }   // telegraph claw raise
        else { b.state = "dashT"; b.t = 35; b.dashTo = p.x + p.w / 2; }
      }
    } else if (b.state === "slamT") {
      if (b.t <= 0) { b.state = "slam"; b.t = 130; b.slamTick = 0; sfx.boom(); run.shake = 10; }
    } else if (b.state === "slam") {
      b.slamTick--;
      if (b.slamTick <= 0) {                     // rain glitch bubbles near the player
        b.slamTick = 22;
        run.bubbles.push({ x: Math.max(WALL_L + 20, Math.min(WALL_R - 20, p.x + (Math.random() * 480 - 240))),
                           y: -20, vy: 2.4 + Math.random() * 1.6, vx: (Math.random() - .5) * 1.2, r: 16 });
      }
      if (b.t <= 0) { b.state = "idle"; b.t = 40 + Math.random() * 40; }
    } else if (b.state === "dashT") {
      if (b.t <= 0) { b.state = "dash"; b.vx = Math.sign(b.dashTo - cx) * 6.5; sfx.roar(); }
    } else if (b.state === "dash") {
      b.x += b.vx;
      if ((b.vx > 0 && b.x + b.w >= WALL_R) || (b.vx < 0 && b.x <= WALL_L) || Math.abs(b.dashTo - cx) < 20) {
        b.state = "idle"; b.t = 35 + Math.random() * 30; b.vx = 0; run.shake = Math.max(run.shake, 6);
      }
      b.x = Math.max(WALL_L, Math.min(WALL_R - b.w, b.x));
    }
    // boss body touch hurts
    if (p.inv <= 0 && p.x < b.x + b.w && p.x + p.w > b.x && p.y < b.y + b.h && p.y + p.h > b.y) {
      hurtPlayer(2, cx);
    }
  }
  // boss death sequence → win
  if (b.dead && b.deathT > 0) {
    b.deathT--;
    if (b.deathT % 8 === 0) burst(b.x + Math.random() * b.w, b.y + Math.random() * b.h, 12, ["#39ffcc", "#ff2d55", "#ffe600"], 5);
    if (b.deathT % 10 === 0) sfx.boom();
    if (b.deathT <= 0) { run.score += 500; state = "win"; sfx.win(); }
  }

  /* --- glitch bubbles (boss attack) --- */
  for (const gb of run.bubbles) {
    gb.y += gb.vy; gb.x += gb.vx;
    if (p.inv <= 0 && Math.abs(p.x + p.w / 2 - gb.x) < gb.r + 10 && Math.abs(p.y + p.h / 2 - gb.y) < gb.r + 16) {
      hurtPlayer(1, gb.x); gb.dead = true;
    }
    for (const s of solids) {                    // pop on ground
      if (gb.y > s.y - 6 && gb.y < s.y + 20 && gb.x > s.x && gb.x < s.x + s.w) { gb.dead = true; burst(gb.x, gb.y, 6, ["#b06bff", "#39ffcc"], 2); }
    }
    if (gb.y > H + 40) gb.dead = true;
  }
  run.bubbles = run.bubbles.filter(gb => !gb.dead);

  /* --- particles / toast / shake --- */
  for (const pt of run.parts) { pt.x += pt.vx; pt.y += pt.vy; pt.vy += .12; pt.life--; }
  run.parts = run.parts.filter(pt => pt.life > 0);
  if (run.toast) { run.toast.t--; if (run.toast.t <= 0) run.toast = null; }
  if (run.shake > 0) run.shake *= .86;
}

/* ---------- 7. Render ------------------------------------------------------ */
// pre-rendered scanline overlay (cheap CRT feel)
const scan = document.createElement("canvas");
scan.width = 4; scan.height = 4;
{ const c = scan.getContext("2d"); c.fillStyle = "rgba(0,0,0,.16)"; c.fillRect(0, 0, 4, 2); }
const scanPat = ctx.createPattern(scan, "repeat");

function rr(x, y, w, h, r) {             // rounded-rect path helper
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* --- parallax background: sky, ocean, grid mesas, rack skyline, palms --- */
function drawBG(cam) {
  // sunset gradient sky
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#12063a"); g.addColorStop(.45, "#3b0f5e");
  g.addColorStop(.68, "#a12a6b"); g.addColorStop(.82, "#ff7a4d"); g.addColorStop(1, "#0b3b46");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // retro sun with horizontal slits
  const sx = W * .72 - cam * .02, sy = 150;
  const sg = ctx.createLinearGradient(0, sy - 70, 0, sy + 70);
  sg.addColorStop(0, "#ffe600"); sg.addColorStop(1, "#ff2d55");
  ctx.save(); ctx.beginPath(); ctx.arc(sx, sy, 70, 0, 7); ctx.clip();
  ctx.fillStyle = sg; ctx.fillRect(sx - 70, sy - 70, 140, 140);
  ctx.fillStyle = "#12063a";
  for (let i = 0; i < 7; i++) ctx.fillRect(sx - 70, sy + i * 12 - 6, 140, 3 + i);
  ctx.restore();

  // ocean band with animated foam lines
  ctx.fillStyle = "#0a2f4f"; ctx.fillRect(0, 300, W, 90);
  ctx.strokeStyle = "rgba(57,255,204,.35)"; ctx.lineWidth = 2;
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    const yy = 316 + i * 20;
    for (let x = 0; x <= W; x += 8) {
      const y = yy + Math.sin((x + frame * (1 + i * .5) - cam * .1) * .03) * 3;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  // layer 1: neon grid mesas (far)
  ctx.strokeStyle = "rgba(255,45,85,.5)"; ctx.lineWidth = 2;
  const off1 = cam * .15;
  for (let i = -1; i < 8; i++) {
    const bx = ((i * 300 - off1) % (W + 600) + W + 600) % (W + 600) - 300;
    const bh = 90 + (i * 53 % 70);
    ctx.strokeRect(bx, 300 - bh, 180, bh);
    ctx.strokeStyle = "rgba(176,107,255,.3)";
    for (let gy = 300 - bh + 15; gy < 300; gy += 15) { ctx.beginPath(); ctx.moveTo(bx, gy); ctx.lineTo(bx + 180, gy); ctx.stroke(); }
    ctx.strokeStyle = "rgba(255,45,85,.5)";
  }

  // layer 2: server-rack skyline + glitch palms (mid)
  const off2 = cam * .4;
  for (let i = -1; i < 12; i++) {
    const bx = ((i * 220 - off2) % (W + 440) + W + 440) % (W + 440) - 220;
    if (i % 3 === 0) {                       // server rack with blinking LEDs
      const rh = 120 + (i * 37 % 60);
      ctx.fillStyle = "#1b1040"; ctx.fillRect(bx, 390 - rh, 70, rh);
      ctx.strokeStyle = "#39ffcc"; ctx.lineWidth = 1; ctx.strokeRect(bx + .5, 390 - rh + .5, 70, rh);
      for (let r = 0; r < rh / 14; r++) {
        ctx.fillStyle = ((frame >> 4) + r + i) % 3 ? "#39ffcc" : "#ff2d55";
        ctx.fillRect(bx + 8, 390 - rh + 6 + r * 14, 4, 3);
        ctx.fillStyle = ((frame >> 5) + r * 2 + i) % 4 ? "#ffe600" : "#222";
        ctx.fillRect(bx + 16, 390 - rh + 6 + r * 14, 4, 3);
      }
    } else {                                 // glitchy neon palm
      const ph = 80 + (i * 29 % 50), tx = bx + 30;
      ctx.strokeStyle = "#b06bff"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(tx, 390); ctx.lineTo(tx + Math.sin(i) * 8, 390 - ph); ctx.stroke();
      ctx.strokeStyle = "#39ffcc";
      for (let f = 0; f < 5; f++) {
        const a = Math.PI + f * .5 + Math.sin(frame * .02 + i) * .06;
        ctx.beginPath(); ctx.moveTo(tx, 390 - ph);
        ctx.lineTo(tx + Math.cos(a) * 34, 390 - ph + Math.sin(a) * 22); ctx.stroke();
      }
    }
  }
}

/* --- world geometry: ground, platforms, pits, checkpoints --- */
function drawWorld(cam) {
  // glitch pits: glowing void between ground segments
  for (let i = 0; i < grounds.length - 1; i++) {
    const a = grounds[i], b2 = grounds[i + 1];
    const gx = a.x + a.w, gw = b2.x - gx;
    const pg = ctx.createLinearGradient(0, GROUND_Y, 0, H);
    pg.addColorStop(0, "rgba(255,45,85,.0)"); pg.addColorStop(1, "rgba(255,45,85,.6)");
    ctx.fillStyle = pg; ctx.fillRect(gx, GROUND_Y, gw, H - GROUND_Y);
    // rising glitch sparks in the pit
    for (let s = 0; s < 3; s++) {
      const sy = H - ((frame * 2 + s * 90 + i * 40) % (H - GROUND_Y));
      ctx.fillStyle = (frame + s) % 10 < 5 ? "#ff2d55" : "#39ffcc";
      ctx.fillRect(gx + ((s * 37 + i * 13) % gw), sy, 3, 3);
    }
  }
  // ground: sand over circuit-board traces
  for (const s of grounds) {
    if (s.x + s.w < cam || s.x > cam + W) continue;
    ctx.fillStyle = "#2a1a4a"; ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.fillStyle = "#c9a86b"; ctx.fillRect(s.x, s.y, s.w, 10);          // beach strip
    ctx.strokeStyle = "rgba(57,255,204,.35)"; ctx.lineWidth = 1;         // circuit traces
    for (let x = Math.floor(s.x / 60) * 60; x < s.x + s.w; x += 60) {
      if (x < s.x) continue;
      ctx.beginPath(); ctx.moveTo(x, s.y + 22); ctx.lineTo(x + 24, s.y + 22);
      ctx.lineTo(x + 30, s.y + 30); ctx.lineTo(x + 54, s.y + 30); ctx.stroke();
      ctx.fillStyle = "rgba(255,230,0,.5)"; ctx.fillRect(x + 22, s.y + 20, 4, 4);
    }
    ctx.strokeStyle = "#39ffcc"; ctx.lineWidth = 2;                       // glowing lip
    ctx.beginPath(); ctx.moveTo(s.x, s.y + 1); ctx.lineTo(s.x + s.w, s.y + 1); ctx.stroke();
  }
  // platforms: floating server blades
  for (const s of plats) {
    if (s.x + s.w < cam || s.x > cam + W) continue;
    ctx.fillStyle = "#16213e"; ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.strokeStyle = "#ff7a4d"; ctx.lineWidth = 1.5; ctx.strokeRect(s.x, s.y, s.w, s.h);
    ctx.fillStyle = "#39ffcc";
    for (let x = s.x + 6; x < s.x + s.w - 6; x += 14) ctx.fillRect(x, s.y + s.h - 5, 6, 2);
  }
  // checkpoints: little server racks with an antenna
  for (const c of run.cps) {
    const x = c.x;
    ctx.fillStyle = "#1b1040"; ctx.fillRect(x - 12, GROUND_Y - 56, 24, 56);
    ctx.strokeStyle = c.on ? "#39ffcc" : "#5a4a8a"; ctx.lineWidth = 2; ctx.strokeRect(x - 12, GROUND_Y - 56, 24, 56);
    ctx.beginPath(); ctx.moveTo(x, GROUND_Y - 56); ctx.lineTo(x, GROUND_Y - 74); ctx.stroke();
    const on = c.on && (frame >> 3) % 2 === 0;
    ctx.fillStyle = c.on ? (on ? "#39ffcc" : "#0e5c4a") : "#444";
    ctx.fillRect(x - 3, GROUND_Y - 80, 6, 6);                             // beacon
    if (c.on) { ctx.fillStyle = "rgba(57,255,204,.15)"; ctx.beginPath(); ctx.arc(x, GROUND_Y - 77, 14 + (frame % 30) * .4, 0, 7); ctx.fill(); }
    for (let r = 0; r < 3; r++) { ctx.fillStyle = c.on ? "#ffe600" : "#333"; ctx.fillRect(x - 7, GROUND_Y - 48 + r * 14, 5, 4); }
  }
}

/* --- tokens: spinning golden hex "tokens" --- */
function drawTokens(cam) {
  for (const t of run.tokens) {
    if (t.got || t.x < cam - 30 || t.x > cam + W + 30) continue;
    const sc = Math.abs(Math.sin(frame * .06 + t.x * .01));      // fake 3D spin
    ctx.save(); ctx.translate(t.x, t.y + Math.sin(frame * .08 + t.x) * 3);
    ctx.scale(.4 + sc * .6, 1);
    ctx.fillStyle = "#ffe600";
    ctx.beginPath();
    for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2 + Math.PI / 6; ctx.lineTo(Math.cos(a) * 9, Math.sin(a) * 9); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#b8860b"; ctx.font = "bold 10px monospace"; ctx.textAlign = "center";
    ctx.fillText("$", 0, 4);
    ctx.restore();

}

function drawEnemies(cam) {

/* --- boss: GLITCHLAW the disfigured cyber-lobster --- */
function drawBoss(cam) {
  const b = run.boss;
  if (!b.active || (b.dead && b.deathT <= 0)) return;
  const bob = Math.sin(frame * .06) * 4;
  const raise = (b.state === "slamT" || b.state === "slam") ? -18 : 0;
  const telegraph = (b.state === "dashT" || b.state === "slamT") && (frame >> 2) % 2 === 0;

  // glitch body: RGB-split ghosts + random slice offsets
  const ghosts = [["rgba(255,45,85,.35)", -4], ["rgba(57,255,204,.35)", 4]];
  for (const [col, ox] of ghosts) { ctx.save(); ctx.translate(ox, 0); lobster(b, bob, raise, col, telegraph); ctx.restore(); }
  const slices = 6, sh = b.h / slices;
  for (let i = 0; i < slices; i++) {
    const off = Math.random() < .12 ? (Math.random() * 14 - 7) : 0;   // occasional slice jump
    ctx.save();
    ctx.beginPath(); ctx.rect(b.x - 60, b.y + i * sh + bob, b.w + 120, sh); ctx.clip();
    lobster(b, bob, raise, null, telegraph);
    if (off) ctx.translate(off, 0);
    ctx.restore();
  }
}
function lobster(b, bob, raise, flatColor, telegraph) {
  const x = b.x, y = b.y + bob;
  ctx.save();
  if (flatColor) ctx.globalAlpha = .8;
  const body = flatColor || (b.hitFlash > 0 ? "#ffffff" : (telegraph ? "#ff7a4d" : "#c2185b"));
  const dark = flatColor || "#7b1030";
  // tail fan
  ctx.fillStyle = dark;
  for (let f = -1; f <= 1; f++) {
    ctx.beginPath();
    ctx.moveTo(x + 30, y + 90);
    ctx.quadraticCurveTo(x - 20, y + 70 + f * 22, x - 45, y + 85 + f * 26);
    ctx.quadraticCurveTo(x - 10, y + 95, x + 30, y + 100);
    ctx.closePath(); ctx.fill();
  }
  // segmented body
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(x + 110, y + 70, 80, 42, 0, 0, 7); ctx.fill();
  for (let s = 0; s < 4; s++) {                              // shell armour plates
    ctx.fillStyle = flatColor || "#e91e63";
    ctx.beginPath(); ctx.ellipse(x + 60 + s * 32, y + 48, 20, 12, -.2, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = flatColor || "#39ffcc"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(x + 60 + s * 32, y + 48, 20, 12, -.2, Math.PI, 0); ctx.stroke();
  }
  // glitch cracks across the shell
  if (!flatColor) {
    ctx.strokeStyle = (frame >> 3) % 2 ? "#39ffcc" : "#ffe600"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x + 70, y + 55); ctx.lineTo(x + 85, y + 70); ctx.lineTo(x + 78, y + 85); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + 130, y + 50); ctx.lineTo(x + 142, y + 66); ctx.stroke();
  }
  // head
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(x + 185, y + 62, 34, 30, .2, 0, 7); ctx.fill();
  // glowing eyes on stalks (mismatched sizes)
  ctx.strokeStyle = dark; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(x + 190, y + 40); ctx.lineTo(x + 196, y + 22); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 205, y + 42); ctx.lineTo(x + 214, y + 28); ctx.stroke();
  const eyeGlow = (frame >> 3) % 2 ? "#39ffcc" : "#ffe600";
  ctx.fillStyle = flatColor || eyeGlow;
  ctx.beginPath(); ctx.arc(x + 196, y + 20, 7, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 214, y + 26, 4.5, 0, 7); ctx.fill();
  // antennae (one straight, one bent)
  ctx.strokeStyle = flatColor || "#ff7a4d"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x + 200, y + 36); ctx.quadraticCurveTo(x + 230, y + 10, x + 250, y + 18); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 196, y + 34); ctx.quadraticCurveTo(x + 210, y - 6, x + 226, y + 2); ctx.stroke();
  // LEFT claw: huge blocky cyan servo-claw (raised during slam telegraph)
  ctx.save(); ctx.translate(x + 30, y + 78 + raise);
  ctx.fillStyle = flatColor || "#0e7490"; ctx.fillRect(-26, -10, 26, 20);           // arm
  ctx.fillStyle = flatColor || "#39ffcc"; ctx.fillRect(-52, -22, 30, 44);           // big claw
  ctx.fillStyle = flatColor || "#0b3b46"; ctx.fillRect(-52, -4, 22, 8);             // pincer gap
  if (!flatColor) { ctx.strokeStyle = "#39ffcc"; ctx.lineWidth = 1; ctx.strokeRect(-52, -22, 30, 44); }
  ctx.restore();
  // RIGHT claw: thin jagged magenta claw
  ctx.save(); ctx.translate(x + 160, y + 96 - raise * .5);
  ctx.fillStyle = flatColor || "#7b1fa2"; ctx.fillRect(0, -6, 24, 12);
  ctx.fillStyle = flatColor || "#ff2d55";
  ctx.beginPath();
  ctx.moveTo(24, -14); ctx.lineTo(48, -8); ctx.lineTo(36, 0); ctx.lineTo(50, 6); ctx.lineTo(24, 14);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  // spiky legs
  ctx.strokeStyle = flatColor || "#ff2d55"; ctx.lineWidth = 3;
  for (let l = 0; l < 4; l++) {
    const lx = x + 60 + l * 34, sw = Math.sin(frame * .18 + l * 1.7) * 5;
    ctx.beginPath(); ctx.moveTo(lx, y + 92); ctx.lineTo(lx - 8 + sw, y + 128); ctx.stroke();
  }
  ctx.restore();
}

  // health as segmented blocks
  ctx.font = "9px monospace"; ctx.fillStyle = "#8fa"; ctx.fillText("SYS.INTEGRITY", 20, 42);
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = i < p.hp ? (p.hp <= 2 ? "#ff2d55" : "#39ffcc") : "#28203f";
    ctx.fillRect(110 + i * 19, 34, 15, 9);
  }
  // top-right panel: score / tokens / progress
  ctx.fillStyle = "rgba(5,3,13,.65)"; rr(W - 330, 8, 320, 46, 8); ctx.fill();
  ctx.strokeStyle = "#ffe600"; rr(W - 330, 8, 320, 46, 8); ctx.stroke();
  ctx.fillStyle = "#ffe600"; ctx.font = "bold 13px monospace"; ctx.textAlign = "right";
  ctx.fillText("SCORE " + String(run.score).padStart(5, "0"), W - 20, 25);
  // token icon + count
  ctx.fillStyle = "#ffe600";
  ctx.beginPath();
  for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2 + Math.PI / 6; ctx.lineTo(W - 152 + Math.cos(a) * 7, 39 + Math.sin(a) * 7); }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "bold 12px monospace";
  ctx.fillText(run.tokensGot + "/" + run.tokens.length, W - 120, 43);
  // progress bar to the boss
  const prog = Math.min(1, (p.x) / BOSS_TRIGGER);
  ctx.fillStyle = "#28203f"; ctx.fillRect(W - 105, 34, 85, 9);
  ctx.fillStyle = "#b06bff"; ctx.fillRect(W - 105, 34, 85 * prog, 9);
  ctx.strokeStyle = "#b06bff"; ctx.strokeRect(W - 105.5, 33.5, 86, 10);
  ctx.fillStyle = "#ff2d55"; ctx.font = "9px monospace"; ctx.fillText("BOSS", W - 108, 42);
  ctx.fillStyle = "#39ffcc"; ctx.fillRect(W - 105 + 85 * prog - 1, 32, 3, 13);   // player pip

  // boss health bar (bottom center) once engaged
  const b = run.boss;
  if (b.active && !b.dead) {
    ctx.fillStyle = "rgba(5,3,13,.7)"; rr(W / 2 - 210, H - 42, 420, 30, 8); ctx.fill();
    ctx.strokeStyle = "#ff2d55"; rr(W / 2 - 210, H - 42, 420, 30, 8); ctx.stroke();
    ctx.fillStyle = "#ff2d55"; ctx.font = "bold 11px monospace"; ctx.textAlign = "center";
    ctx.fillText("GLITCHLAW // CORRUPTED CRUSTACEAN", W / 2, H - 30);
    ctx.fillStyle = "#28203f"; ctx.fillRect(W / 2 - 195, H - 25, 390, 8);
    ctx.fillStyle = "#ff2d55"; ctx.fillRect(W / 2 - 195, H - 25, 390 * Math.max(0, b.hp / b.maxhp), 8);
  }
  // toast message
  if (run.toast) {
    const a = Math.min(1, run.toast.t / 40);
    ctx.globalAlpha = a;
    ctx.fillStyle = "rgba(5,3,13,.75)"; rr(W / 2 - 170, 80, 340, 34, 8); ctx.fill();
    ctx.strokeStyle = "#39ffcc"; rr(W / 2 - 170, 80, 340, 34, 8); ctx.stroke();
    ctx.fillStyle = "#39ffcc"; ctx.font = "bold 14px monospace"; ctx.textAlign = "center";
    ctx.fillText(run.toast.text, W / 2, 102);
    ctx.globalAlpha = 1;
  }
}

/* --- overlay screens --- */
function dim(a) { ctx.fillStyle = "rgba(5,3,13," + a + ")"; ctx.fillRect(0, 0, W, H); }
function glitchTitle(text, y, size, col) {
  ctx.font = "bold " + size + "px monospace"; ctx.textAlign = "center";
  const j = () => (Math.random() * 6 - 3);
  ctx.fillStyle = "rgba(255,45,85,.7)"; ctx.fillText(text, W / 2 + j(), y + j());
  ctx.fillStyle = "rgba(57,255,204,.7)"; ctx.fillText(text, W / 2 + j(), y + j());
  ctx.fillStyle = col; ctx.fillText(text, W / 2, y);
}
function drawStart() {
  dim(.55);
  glitchTitle("HERMES://SHORE", 150, 56, "#fff");
  ctx.font = "14px monospace"; ctx.textAlign = "center"; ctx.fillStyle = "#b06bff";
  ctx.fillText("a tiny terminal explorer vs. a very large glitch problem", W / 2, 185);
  // control card
  ctx.fillStyle = "rgba(5,3,13,.7)"; rr(W / 2 - 230, 220, 460, 190, 10); ctx.fill();
  ctx.strokeStyle = "#39ffcc"; rr(W / 2 - 230, 220, 460, 190, 10); ctx.stroke();
  ctx.fillStyle = "#39ffcc"; ctx.font = "bold 15px monospace";
  ctx.fillText("[ CONTROLS ]", W / 2, 250);
  ctx.font = "13px monospace"; ctx.fillStyle = "#cfd8ff";
  const lines = [
    "MOVE ............ Arrow keys / WASD",
    "JUMP ............ Space",
    "SHOOT ........... J  or  Left mouse",
    "RESTART ......... R",
    "",
    "Collect tokens. Touch glowing racks to save.",
    "Do NOT fall in the pits. Find the lobster.",
  ];
  lines.forEach((l, i) => ctx.fillText(l, W / 2, 280 + i * 20));
  if ((frame >> 4) % 2 === 0) {
    ctx.fillStyle = "#ffe600"; ctx.font = "bold 18px monospace";
    ctx.fillText("PRESS ENTER TO BOOT", W / 2, 455);
  }
}
function drawOver() {
  dim(.7);
  glitchTitle("CONNECTION LOST", 200, 52, "#ff2d55");
  ctx.font = "16px monospace"; ctx.textAlign = "center"; ctx.fillStyle = "#cfd8ff";
  ctx.fillText("the shoreline consumed another agent", W / 2, 245);
  ctx.fillStyle = "#ffe600"; ctx.font = "bold 20px monospace";
  ctx.fillText("SCORE " + run.score + "   TOKENS " + run.tokensGot + "/" + run.tokens.length, W / 2, 300);
  if ((frame >> 4) % 2 === 0) {
    ctx.fillStyle = "#39ffcc"; ctx.font = "bold 18px monospace";
    ctx.fillText("PRESS R TO RECONNECT", W / 2, 370);
  }
}
function drawWin() {
  dim(.6);
  glitchTitle("BOSS DEFEATED", 180, 52, "#39ffcc");
  ctx.font = "16px monospace"; ctx.textAlign = "center"; ctx.fillStyle = "#b06bff";
  ctx.fillText("GLITCHLAW has been deprecated. the shore compiles clean.", W / 2, 225);
  ctx.fillStyle = "#ffe600"; ctx.font = "bold 22px monospace";
  ctx.fillText("FINAL SCORE " + run.score, W / 2, 285);
  ctx.fillStyle = "#fff"; ctx.font = "15px monospace";
  ctx.fillText("TOKENS " + run.tokensGot + " / " + run.tokens.length, W / 2, 315);
  if ((frame >> 4) % 2 === 0) {
    ctx.fillStyle = "#ffe600"; ctx.font = "bold 18px monospace";
    ctx.fillText("PRESS R TO RUN IT BACK", W / 2, 390);
  }
}

/* --- master render --- */
function render() {
  const cam = run ? run.cam : (frame * .5) % WORLD_W;   // start screen auto-scrolls the shore
  ctx.save();
  if (run && run.shake > .5) ctx.translate((Math.random() - .5) * run.shake, (Math.random() - .5) * run.shake);
  drawBG(cam);
  if (run) {
    ctx.save(); ctx.translate(-cam, 0);
    drawWorld(cam);
    drawTokens(cam);
    drawEnemies(cam);
    drawBoss(cam);
    drawBubbles();
    drawBolts(cam);
    drawPlayer(cam);
    drawParts();
    ctx.restore();
    drawHUD();
  }
  ctx.restore();
  // CRT overlays
  ctx.fillStyle = scanPat; ctx.fillRect(0, 0, W, H);
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * .85);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.45)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  if (state === "start") drawStart();
  else if (state === "over") drawOver();
  else if (state === "win") drawWin();
}

/* ---------- 8. Main loop -------------------------------------------------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(32, now - last);             // clamp dt so tab-switches don't teleport anyone
  last = now;
  if (state === "play") update();
  else frame++;                                    // idle animation clock for menus
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// debug/testing hook: lets automated checks poke at run state
window.__HERMES__ = { get state() { return state; }, get run() { return run; }, startRun, keys };
</script>
</body>
